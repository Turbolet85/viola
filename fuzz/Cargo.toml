[package]
name = "viola-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "=1.4.2"
libfuzzer-sys = "=0.4.13"
viola-core = { path = "../crates/viola-core" }
viola-channel = { path = "../crates/viola-channel" }
viola-agent-claude = { path = "../crates/viola-agent-claude" }

# Its own workspace: libfuzzer-sys builds C++ with `cc`, which the root `deny.toml` bans from the
# product graph.
[workspace]
members = ["."]

[[bin]]
name = "viola_name"
path = "fuzz_targets/viola_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "channel_frame"
path = "fuzz_targets/channel_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_stdin"
path = "fuzz_targets/hook_stdin.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vt100_feed"
path = "fuzz_targets/vt100_feed.rs"
test = false
doc = false
bench = false
