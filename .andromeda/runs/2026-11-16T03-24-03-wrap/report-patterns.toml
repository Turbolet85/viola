[[pattern]]
id = 'wake-kinds'
regex = '''wake[- ]kinds|WAIT_WAKE|wake set|wakes? (the|a) (parked )?wait|background-held|whatever its background_tasks'''
ignore_case = true

[[pattern]]
id = 'non-waking'
regex = '''non-waking|harness-origin `?prompt-submitted|no false wake'''
ignore_case = true

[[pattern]]
id = 'stamped-home'
regex = '''stamped[_ -]home|verify-sole-stamp-writer|fresh-home-per-test|rstest-fixture-chain|one stamp per'''
ignore_case = true

[[pattern]]
id = 'stamp-kill'
regex = '''verify-driven-tests-20s-kill|ci-stamped-home-kill|verify-driven'''
ignore_case = true

[[pattern]]
id = 'park-bound'
regex = '''PARK_BOUND|park bound'''
ignore_case = true
