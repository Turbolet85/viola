[[control]]
id = 'cut-no-enter'
entry = 6
guard = 'the commit decision before the CR: the CR written on every path'
case = 'paste_bound_a_cut_paste_closes_the_bracket_without_enter'

[[control.edit]]
path = 'crates/viola-pty/src/pump.rs'
old = '''        Ok(true) => {
            if job.settle(done, Ok(())) {
                let _ = put(to, b"\r");
            }
        }'''
new = '''        Ok(true) => {
            job.settle(done, Ok(()));
            let _ = put(to, b"\r");
        }'''

[[control.edit]]
path = 'crates/viola-pty/src/pump.rs'
old = '''        Ok(false) => {
            let _ = put(to, PASTE_END);
        }'''
new = '''        Ok(false) => {
            let _ = put(to, PASTE_END);
            let _ = put(to, b"\r");
        }'''

[[control]]
id = 'writer-join'
entry = 7
guard = 'the sender drop and the bounded join at the pump return (the writer stop with them)'
case = 'pump_returns_with_the_writer_blocked_on_a_child_that_never_reads'

[[control.edit]]
path = 'crates/viola-pty/src/pump.rs'
old = '''    *paste.lock() = None;
    stop.store(true, Ordering::SeqCst);
    let deadline = Instant::now() + KILL_WAIT;
    while !writing.is_finished() {
        if Instant::now() >= deadline {
            return;
        }
        std::thread::sleep(ENQUEUE_POLL);
    }
    let _ = writing.join();'''
new = '''    let _ = (paste, stop, writing);'''
