[[pattern]]
id = 'spawn-sites'
regex = '44 hits|24 files|Command::new\([^)]*VIOLA|untied|cross_killed_test|cross_exit_causes'

[[pattern]]
id = 'nextest-counts'
regex = '(505|509|348|369) (passed|tests|cases|integration|e2e)|integration 505|E2E 348'

[[pattern]]
id = 'stamp-reuse'
regex = 'one-verify-stamp-per-build|stamp_dir|viola-stamp-|stamped_home|stamp_counts|hollow stamp'

[[pattern]]
id = 'drop-guard'
regex = 'wrapper-drop-guard|[Dd]rop guard|PR_SET_PDEATHSIG|[Pp]arent-death|tied\.rs|BootOptions|harness_session'

[[pattern]]
id = 'rust-cache'
regex = 'rust-cache-only-cache|rust-cache'

[[pattern]]
id = 'test-markers'
regex = 'ROOT_TIED_TEST_CHILD|HARNESS_TIED_TEST_CHILD|TEST_CHILD|self-spawn'
