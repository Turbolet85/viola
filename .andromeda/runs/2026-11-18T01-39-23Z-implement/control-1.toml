[[control]]
id = 'seed-markers'
entry = 4
guard = "seed_used_markers's merge removed: the body returns Ok(()), nothing written"
case = 'seed_used_markers_writes_the_six_bundle_markers_and_keeps_the_seed'

[[control.edit]]
path = 'crates/viola-e2e/src/rig/isolate.rs'
old = '''        let path = self.config.join(".claude.json");
        let Some(Value::Object(mut seed)) = read_json(&path) else {
            return Err(io::Error::other("seed unread"));
        };
        for (key, marker) in USED_MARKERS {
            seed.insert(key.to_owned(), marker.value(version));
        }
        write_private(&path, &Value::Object(seed))'''
new = '''        let _ = version;
        Ok(())'''

[[control]]
id = 'fs-adjacent'
