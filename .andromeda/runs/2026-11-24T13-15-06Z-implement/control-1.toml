[[control]]
id = 'sw-turn'
entry = 5
guard = 'the turn-running rung of first_refusal in src/run/switch.rs'
case = 'switch_refusal_order_cases::case_2_turn_running_before_dialog'

[[control.edit]]
path = 'src/run/switch.rs'
old = '''    if reads.busy {
        return Err(Rung::TurnRunning);
    }
'''
new = ''

[[control]]
id = 'sw-dialog'
entry = 5
guard = 'the dialog-pending rung of first_refusal in src/run/switch.rs'
case = 'switch_refusal_order_cases::case_3_dialog_before_unverified'

[[control.edit]]
path = 'src/run/switch.rs'
old = '''    if reads.dialog_pending {
        return Err(Rung::DialogPending);
    }
'''
new = ''

[[control]]
id = 'sw-launch-first'
entry = 5
guard = 'the launch append between the old child reap and the spawn, moved after the respawn returns'
case = 'switch_appends_launch_before_the_spawn'

[[control.edit]]
path = 'src/run/switch.rs'
old = '''            *slot.lock().unwrap_or_else(PoisonError::into_inner) =
                append_event(&dir, &line).map_err(|_| ());
        };
        let respawner = self.respawner.get().ok_or(PtyError::NoInput)?;
        let respawned = respawner(spec, Box::new(between))?;
'''
new = '''            *slot.lock().unwrap_or_else(PoisonError::into_inner) = Ok(());
            drop((dir, line));
        };
        let respawner = self.respawner.get().ok_or(PtyError::NoInput)?;
        let respawned = respawner(spec, Box::new(between))?;
        let late = json!({"model": pair.model, "effort": pair.effort});
        let line = EventLine::new(&self.name, EventKind::Launch, Source::Wrapper, late, Utc::now());
        let _ = append_event(&self.instance_dir, &line);
'''

[[control]]
id = 'pty-reap-bound'
entry = 3
guard = 'the reap bound check of reap_within in crates/viola-pty/src/pump.rs'
case = 'respawn_of_a_child_ignoring_the_signal_reads_not_ended'

[[control.edit]]
path = 'crates/viola-pty/src/pump.rs'
old = '''        if now() >= deadline {
            return Ok(None);
        }
'''
new = ''
