[[control]]
id = 'trail-trim'
entry = 7
guard = "is_submitted_form's trailing-run alternative removed, leaving submitted == typed"
case = 'send_a_prompt_the_cli_trimmed_at_the_end_is_relabelled_driver_and_confirmed'

[[control.edit]]
path = 'crates/viola-agent-claude/src/hook.rs'
old = '''
    submitted == typed
        || (!submitted.is_empty() && typed.trim_end_matches(SUBMIT_TRIM) == submitted)
}'''
new = '''
    submitted == typed
}'''

[[control]]
id = 'locked-turn-read'
entry = 6
guard = "send's guarded turn-running read removed"
case = 'send_a_turn_started_after_the_post_gate_window_is_turn_running_and_types_nothing'

[[control.edit]]
path = 'src/run/send.rs'
old = '''
        if slot.wheel.turn_running() {
            drop(flight);
            return ctx.not_delivered(None, NotDelivered::TurnRunning);
        }
'''
new = '''
'''

[[control]]
id = 'fake-trim'
entry = 9
guard = "the fake agent's --trim-prompt-end arm sends the prompt whole"
case = 'send_ending_in_whitespace_the_cli_trims_is_read_back_and_keeps_the_wheel'

[[control.edit]]
path = 'src/bin/viola-fake-agent.rs'
old = '''text.trim_end_matches([' ', '\t', '\r', '\n'])'''
new = '''&*text'''
