[[pattern]]
id = 'precedence'
regex = '[Pp]recedence|which `?viola`? (MCP )?server'

[[pattern]]
id = 'exit1'
regex = 'exits 1 blocks|that exits 1'

[[pattern]]
id = 'setup-row'
regex = 'run, revive, verify'

[[pattern]]
id = 'help-pin'
fixed = 'help_lists_only_served_verbs'

[[pattern]]
id = 'refuse-census'
