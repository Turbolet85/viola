[[control]]
id = 'context-listed'
entry = 5
guard = 'the /context entry of LOCAL_COMMANDS (plan step 1), its name moved off the list so /context classifies as an ordinary prompt'
case = 'send_local_command_context_is_read_back_on_a_verified_cli'

[[control.edit]]
path = 'crates/viola-agent-claude/src/ledger.rs'
old = '''    ("/context", Some(PostCondition::CommandStdout)),'''
new = '''    ("/context-off-the-list", Some(PostCondition::CommandStdout)),'''

[[control]]
id = 'first-act'
entry = 5
guard = 'plan control first-act-unconfirmable: echo_from setting f.confirms = Confirms::Nothing on an end_of of None, so the send waits for a tag instead'
case = 'send_local_command_context_before_its_transcript_exists_is_unconfirmable'

[[control.edit]]
path = 'src/run/send.rs'
old = '''        if echo.is_none() {
            f.confirms = Confirms::Nothing;
        }
'''
new = ''

[[control]]
id = 'kept-noclobber'
entry = 7
guard = 'plan control kept-stamp-noclobber: the exists refusal of the kept stamp copy (plan step 13): the copy replaces a standing file'
case = 'rig_rehearsal_cs_keeps_the_stamp_and_reads_the_config_top_level'

[[control.edit]]
path = 'crates/viola-e2e/src/rig/mod.rs'
old = '''    match viola_state::fs::place_private_new(
        &out.join(CONTEXT_STAMP),
        &bytes,
        viola_state::fs::FILE_MODE,
    ) {'''
new = '''    match viola_state::fs::replace_private(
        &out.join(CONTEXT_STAMP),
        &bytes,
        viola_state::fs::FILE_MODE,
    )
    .map(|()| viola_state::fs::Placed::Written)
    {'''
