[[pattern]]
id = 'm-except'
regex = 'rig seeds config|Test-only rig seeds'

[[pattern]]
id = 'm-turn-end'
regex = 'after a turn end, the box row|box row.s cell attributes'

[[pattern]]
id = 'm-echo-probe'
regex = 'exact verify echo probe command|/mcp only by a new stdout tag'

[[pattern]]
id = 'm-verified'
regex = 'stamped by `?viola verify`? prints|unstamped CLI build'

[[pattern]]
id = 'm-unconfirm'
regex = 'unverified CLI or in a session that declared no transcript|or is a stdout echo with no readable session transcript'
