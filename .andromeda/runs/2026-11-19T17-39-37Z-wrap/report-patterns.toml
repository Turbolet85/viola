[[pattern]]
id = 'arms'
regex = '\b16 arms\b|\b17 arms\b|\barm set\b|\bArm::|\brig arms?\b'

[[pattern]]
id = 'rehearsals'
regex = 'rig_rehearsal|rehearsals? over the fake agent|rehearse --contain'

[[pattern]]
id = 'fake-opts'
regex = '''--turn-fail|--turn-stop|--settings-hooks|fake agent's (two )?(argv )?options?'''

[[pattern]]
id = 'sf-exception'
regex = 'StopFailure'

[[pattern]]
id = 'sandbox'
regex = 'bwrap|bubblewrap|network-closed|sandbox'

[[pattern]]
id = 'capture'
regex = 'live-rig-prompt-capture-closed|claude-shapes-in-one-crate|Test-only, no value|source word of its own captured'

[[pattern]]
id = 'cell-attr'
regex = 'no-screen-content-parsing|cell attributes?|placeholder hint'

[[pattern]]
id = 'runtime-dir'
regex = 'no-runtime-dir|runtime_dir_crosses|sandbox_probe'

[[pattern]]
id = 'kept-dir'
regex = 'keep_record|kept record|record dir keyed|kept dir'
