[[control]]
id = "echo-offset"
entry = 6
guard = "the pre-paste offset: the echo is counted from 0 instead of the transcript's end before the paste"
case = "send_local_command_echo_tag_before_the_send_is_not_its_echo"

[[control.edit]]
path = "src/run/send.rs"
old = '''.and_then(|path| echo::end_of(&path).map(|end| (path, end)));'''
new = '''.and_then(|path| echo::end_of(&path).map(|_| (path, 0)));'''

[[control]]
id = "name-args"
entry = 4
guard = "the name-plus-arguments arm of local_command_of: an exact name alone is accepted"
case = "local_command_of_reads_the_name_and_one_space::case_03_mcp_with_arguments"

[[control.edit]]
path = "crates/viola-agent-claude/src/ledger.rs"
old = '''            rest.is_empty()
                || rest
                    .strip_prefix(' ')
                    .is_some_and(|args| !args.is_empty() && !args.starts_with(' '))'''
new = '''            rest.is_empty()'''

[[control]]
id = "path-shape"
entry = 4
guard = "transcript_path_ok's file-name check: any absolute path with no parent component is accepted"
case = "transcript_path_ok_reads_the_shape::case_4_file_name_not_the_session_s"

[[control.edit]]
path = "crates/viola-agent-claude/src/ledger.rs"
old = '''            .any(|c| matches!(c, std::path::Component::ParentDir))
        && path
            .file_name()
            .and_then(|name| name.to_str())
            .and_then(|name| name.strip_suffix(".jsonl"))
            == Some(session_id)'''
new = '''            .any(|c| matches!(c, std::path::Component::ParentDir))'''

[[control]]
id = "echo-nofollow"
entry = 6
guard = "O_NOFOLLOW in echo.rs's open: a symbolic link at the transcript path is followed"
case = "echo_a_symlink_is_refused"

[[control.edit]]
path = "src/run/send/echo.rs"
old = '''        .custom_flags(libc::O_NOFOLLOW)
'''
new = ''''''
