# Phase 1 site sweep — one pattern per moved fact of the report (Counts / qualifiers moved, Expected amendments)

[[pattern]]
id = 'rows22'
regex = '''(?i)\b22 (relied |capability[- ]ledger |ledger )?rows?\b|\b22nd (relied )?(ledger )?row|LedgerRow::ALL'''

[[pattern]]
id = 'stepctr22'
regex = '''\[(NN|\d\d)/22\]'''

[[pattern]]
id = 'stamped22'
regex = '''22 pass\s+0 fail'''

[[pattern]]
id = 'runs5'
regex = '''(?i)\bfive (interactive )?(PTY )?(runs|children|child|interactive)|\bRuns? A[–-]E\b|verify-child-set'''

[[pattern]]
id = 'pairs8'
regex = '''(?i)\beight (spawn )?pairs|spawn pairs'''

[[pattern]]
id = 'fakestarts6'
regex = '''(?i)\bsix (fake[- ]agent )?starts|starts per verify'''

[[pattern]]
id = 'receipts6'
regex = '''(?i)\bsix (`?env`? )?receipts|env receipts'''

[[pattern]]
id = 'ledgerrows'
fixed = 'LEDGER_ROWS'

[[pattern]]
id = 'claudejson'
regex = '''(?i)\.claude\.json|hasTrustDialogAccepted|trust[- ]record'''

[[pattern]]
id = 'cfgdir'
fixed = 'CLAUDE_CONFIG_DIR'

[[pattern]]
id = 'claudehome'
regex = '''(?i)writes? nothing (in|into|under)[^.\n]{0,30}claude|nothing (is )?written under'''

[[pattern]]
id = 'fakeargv'
regex = '''(?i)--trust-config|argv[- ]only'''

[[pattern]]
id = 'stamphome'
regex = '''(?i)test-owned `?HOME|stamping verify'''

[[pattern]]
id = 'claudeint'
regex = '''(?i)claude[- ]internals'''
