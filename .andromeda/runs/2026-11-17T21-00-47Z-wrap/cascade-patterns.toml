# Main's own cascade patterns — the old wording of the amended claims, across all seven masters

[[pattern]]
id = 'm-runs5'
regex = '''(?i)\bfive (interactive )?(PTY )?(runs|children|probe runs)|\bRuns? A (to|–|-) ?E\b'''

[[pattern]]
id = 'm-pairs8'
regex = '''(?i)\beight (verify )?(spawn )?pairs'''

[[pattern]]
id = 'm-rows22'
regex = '''(?i)\b22nd (relied )?(ledger )?row|\b22 (relied |ledger )rows'''

[[pattern]]
id = 'm-writesnone'
regex = '''(?i)writes? nothing (under|into|in) [^.]*(claude|~/\.claude)'''

[[pattern]]
id = 'm-namesonly'
regex = '''(?i)never (reads? )?a (variable's )?value|values never read'''
