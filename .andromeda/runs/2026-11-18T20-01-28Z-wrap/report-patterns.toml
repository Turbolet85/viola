# Phase 1 site sweep — one pattern per moved fact of the report (Counts / qualifiers moved, Expected amendments)

# the stamped recorded sets 2 -> 3 (STAMPED [&str; 3]); every 24-row probe reads 3 sets
[[pattern]]
id = 'stamped'
regex = 'STAMPED|stamped (recorded )?(fixture )?sets?|two stamped|2 stamped|every stamped set'

# the recorded sets under fixtures/claude/ 4 -> 5 (2.1.325 added)
[[pattern]]
id = 'recsets'
regex = 'fixtures/claude/2\.1\.\d+|fixtures/claude/<|recorded (fixture )?sets?|four recorded|2\.1\.302 (recorded )?(fixture )?set'

# the rig's live labels gain R4 / R4-2 / R4M, arm words vr / mt, the kept record dir (arch name/binary/viola-live-rig)
[[pattern]]
id = 'riglabels'
regex = 'viola-live-rig|\bR4M\b|\bR4-2\b|\bR4\b|live labels?|target/live-rig/'

# test-plan decision/record-home-names-no-home gains the rig's half (refused: record-home)
[[pattern]]
id = 'recordhome'
regex = 'record-home|names_home_component|component `?home`?'

# security decision/mcp-fixtures-via-test-only-tap: the tap's live start as the rig's R4M under its private config
[[pattern]]
id = 'mcptap'
regex = 'mcp-fixtures-via-test-only-tap|viola-mcp-tap|Mcp\.tools-list'
