# main's own cascade patterns: the moved facts of P1's sweep whose leaf sites the rows changed or the report names

# the stamped sets 2 -> 3 (tests-summary.md names 2.1.287 and 2.1.302 alone)
[[pattern]]
id = 'stamped'
regex = 'STAMPED|stamped fixture set|2\.1\.287 and 2\.1\.302 stamped'

# the tap's live start: now the standing rig's R4M under its private config (security decision/mcp-fixtures-via-test-only-tap)
[[pattern]]
id = 'mcptap'
regex = 'viola-mcp-tap|Mcp\.tools-list'

# the rig's half of the record-home rule (test-plan decision/record-home-names-no-home)
[[pattern]]
id = 'recordhome'
regex = 'record-home|component of its path is named home'
