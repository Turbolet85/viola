[[control]]
id = 'bt-absent'
entry = 3
guard = 'the absent clause of ledger::counts removed: only pass counts'
case = 'verified_reads_the_browser_tools_row_absent_as_counting'

[[control.edit]]
path = 'crates/viola-agent-claude/src/ledger.rs'
old = '''    word == "pass" || (row == LedgerRow::BrowserToolsPrompt && word == "absent")'''
new = '''    let _ = row;
    word == "pass"'''

[[control]]
id = 'bt-none'
entry = 3
guard = 'the none-reads-none clause removed from the browser-tools row reading'
case = 'browser_tools_row_reads_fail_when_a_first_screen_reads_none'

[[control.edit]]
path = 'crates/viola-agent-claude/src/ledger.rs'
old = '''    if screens().any(|s| s == FirstScreen::None) {
        return None;
    }
    Some(screens().any(|s| s == FirstScreen::BrowserTools))'''
new = '''    Some(screens().any(|s| s == FirstScreen::BrowserTools))'''

[[control]]
id = 'bt-modalsig'
entry = 3
guard = 'modal-signature reads the whole modal set again, not the untrusted-start slice'
case = 'modal_signature_fails_on_a_browser_tools_screen_at_run_a'

[[control.edit]]
path = 'crates/viola-agent-claude/src/ledger.rs'
old = '''        LedgerRow::ModalSignature => any_row(typed.modal.as_ref(), UNTRUSTED_START_MODALS),'''
new = '''        LedgerRow::ModalSignature => any_row(typed.modal.as_ref(), SIGNATURES.modals),'''
