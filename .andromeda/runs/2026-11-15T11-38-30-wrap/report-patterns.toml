# Wrap P1 site sweep — 2026-11-15-live-round-on-the-trimmed-product. One pattern per moved fact or expected amendment,
# its own wording and its name token joined in one regex.

# F1 — the 3600 s ceiling's PROVISIONAL qualifier (measured live only to about 660 s) leaves; name token DIALOG_HOLD_MAX,
# the decision handles dialog-hold / dialog-hold-bound
[[pattern]]
id = 'hold-prov'
regex = '''DIALOG_HOLD_MAX|about 660 s|660 s|measured live only|decision/dialog-hold|dialog-hold-bound|3600 s ceiling|ceiling of 3600'''

# F2 — claude 2.1.325 stamped 0 fail over the relied set; the masters' newest-CLI statements (2.1.323 latest)
[[pattern]]
id = 'cli-325'
regex = '''2\.1\.325|2\.1\.323'''

# F3 — the folder-trust dialog's measured form on 2.1.325 (two unnumbered options, the selector on the non-trust row);
# name tokens: the trust literal and the trust keys
[[pattern]]
id = 'trust-form'
regex = '''Yes, I trust this folder|folder-trust|trust dialog|trust literal|down-arrow'''

# F4 — the CLI erases the box on DEL (screen read and send-confirmed)
[[pattern]]
id = 'del-erase'
regex = '''erases? on DEL|0x7f|DEL key|a DEL\b'''

# F5 — the user's status row stands at the same place with the same hash wrapped and unwrapped (CARRY 3, v2-05)
[[pattern]]
id = 'status-row'
regex = '''exactly as unwrapped|status row|statusLine\.command|wrapped.{0,40}unwrapped'''

# F6 — a recorder refuses a payload holding /home/ as an absolute path (the scrub's absolute-path code)
[[pattern]]
id = 'abs-path'
regex = '''has_absolute_path|absolute-path'''

# F7 — v2-03 / v1-27, the verified wrapped start, NOT verified this round
[[pattern]]
id = 'v2-03'
regex = '''v2-03|v1-27'''

# F8 — the residual the hold reading closes
[[pattern]]
id = 'res-hold'
regex = '''res-ujtjay7k'''

# F9 — a rig's keys into its own pty and its read-only hash of statusLine.command (expected amendment 3, security-plan)
[[pattern]]
id = 'rig-keys'
regex = '''its own pty|own pty|statusline-read|rig'?s keys'''
