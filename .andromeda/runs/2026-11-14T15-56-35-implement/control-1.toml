[[control]]
id = 'release-budget'
entry = 16
guard = "the budget key's refusal in release (src/run/wheel.rs): a present budget key answers InvalidParams"
case = 'release_carrying_a_budget_key_is_invalid_params_and_moves_no_wheel'

[[control.edit]]
path = 'src/run/wheel.rs'
old = '''
        parse_from(params)?;
        if params.get("budget").is_some() {
            return Err(ProtocolError::InvalidParams);
        }
        settled(self.apply(Input::Release, true))?;
'''
new = '''
        parse_from(params)?;
        settled(self.apply(Input::Release, true))?;
'''
