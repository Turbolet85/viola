[[control]]
id = "kept-names"
entry = 14
guard = "the clause of env_reading that removes the config's kept names from added"
case = "kept_name_reaches_no_stamp_or_record"

[[control.edit]]
path = "crates/viola-agent-claude/src/ledger.rs"
old = '''        .filter(|name| !kept.iter().any(|k| k == name))
'''
new = ''''''

[[control]]
id = "floor-unknown"
entry = 10
guard = "the clause of the identity-floor check that requires unknown empty"
case = "identity_floor_fails_when::case_2_unknown_name"

[[control.edit]]
path = "crates/viola-agent-claude/src/ledger.rs"
old = '''            env.read && env.unknown.is_empty() && env.unshaped == 0'''
new = '''            env.read && env.unshaped == 0'''

[[control]]
id = "prefix-match"
entry = 10
guard = "the clause of cross_session_reading that reads unprefixed when harness_prefix is None"
case = "cross_session_prefix_fails_when::case_2_no_prefix"

[[control.edit]]
path = "crates/viola-agent-claude/src/ledger.rs"
old = '''    if prefix.is_none() {
        return ("unprefixed", None);
    }
'''
new = ''''''
