# Wrap P1 site sweep — 2026-11-22-paste-write-bounded: one pattern per moved fact of the report
# (Counts / qualifiers moved C1-C6; Expected amendments E1-E12; the directive's row D1, inputs#I7).

[[pattern]]
id = 'C1-detail-set'
regex = 'NotDelivered|empty-text|paste-cut'

[[pattern]]
id = 'C2-pty-threads'
regex = 'catch_unwind|catch-unwind|copy threads|PTY threads|run-worker-panic'

[[pattern]]
id = 'C3-fake-opts'
regex = 'stop-reading|stop_reading|fake-agent-cli'

[[pattern]]
id = 'C4-refusal-order'
regex = 'refusal-order|refusal order|send-refusal/order'

[[pattern]]
id = 'C5-send-total'
regex = '48\.5|18\.5|53\.5|23\.5|mcp-call-deadline|MCP_CALL_DEADLINE'

[[pattern]]
id = 'C6-child-within'
regex = 'CHILD_WITHIN|mutants. profile'

[[pattern]]
id = 'E1-paste-bound'
regex = 'send-time-bound|PASTE_BOUND|paste bound|paste write'

[[pattern]]
id = 'E2-bracketed'
regex = 'atomic-bracketed-send|bracketed paste|bracketed-paste|one-bracketed-paste'

[[pattern]]
id = 'E3-cut-mark'
regex = 'cut_at|cut mark'

[[pattern]]
id = 'E4-after-issue'
regex = 'paste-failure-after-issue'

[[pattern]]
id = 'E5-exit13'
regex = 'cli-exit-codes/13|exit 13'

[[pattern]]
id = 'E6-send-framing'
regex = 'paste-framing|driver-send/typed-text|send-event-log/send-issued'

[[pattern]]
id = 'E7-time-bounds'
regex = 'time-bounds-never-on-human|time-bounds-fall-on-the-driver'

[[pattern]]
id = 'E8-hints'
regex = 'refusal-hints|send_hint'

[[pattern]]
id = 'E9-detail-words'
regex = 'send-refused-detail|refusal-reason-words'

[[pattern]]
id = 'D1-never-queued'
regex = 'send-never-queued|never queued'
