[[pattern]]
id = 'relied-25'
regex = '(25 relied|relied rows?[^.]{0,40}\b25\b|\b25 rows|\b25/25|25 pass|LedgerRow::ALL|\[&str; 25\])'

[[pattern]]
id = 'floor-rows'
regex = '(FLOOR_ROWS|floor rows?)'

[[pattern]]
id = 'stamp-lines'
regex = '(stamp_lines|unread word set)'

[[pattern]]
id = 'wheel-rule'
regex = '(human-prompt-confirms-wheel-take|byte-source-wheel-claim|wheel-byte-source-claim|injected-turn-keeps-wheel)'

[[pattern]]
id = 'origin-harness'
regex = '(prompt-submitted-origin|origin[^.]{0,30}harness)'

[[pattern]]
id = 'wakes-count'
regex = '(scheduled_wakes|session_crons|stop-session-crons|turn-ended-scheduled-wakes)'

[[pattern]]
id = 'rig-arms'
regex = '(standing-live-rig|live-rig-hint-cell-reading|fresh box)'

[[pattern]]
id = 'fake-wake'
regex = '(--stop-crons|--wake-after-ms|stop-crons|wake-after-ms)'
