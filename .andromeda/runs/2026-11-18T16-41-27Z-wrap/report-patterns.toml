[[pattern]]
id = 'rows24'
regex = '23 relied|23 rows|23 ledger|23-row|/23\]|23/23|23 pass|; 23\]|browser-tools-prompt'
ignore_case = true

[[pattern]]
id = 'modals3'
regex = 'modal literal|modal signature|Yes, use my browser|BROWSER_TOOLS_LITERAL|UNTRUSTED_START_MODALS'
ignore_case = true

[[pattern]]
id = 'firstscreen'
regex = 'first[-_ ]screen|FirstScreen'
ignore_case = true

[[pattern]]
id = 'verifiedrule'
regex = 'every relied row|all relied rows|version-verified-all-relied-rows|version-gate-needs-all-relied-rows|ledger::counts'
ignore_case = true

[[pattern]]
id = 'summary'
regex = 'n pass|0 fail|step line|step_line|summary line'
ignore_case = true

[[pattern]]
id = 'startscreen'
regex = '--start-screen|argv-only'
ignore_case = true

[[pattern]]
id = 'cachea'
regex = 'cache-a|cachedChromeExtensionInstalled|claude-first-no-adapter-trait'
ignore_case = true

[[pattern]]
id = 'rigarms'
regex = 'standing-live-rig|live-rig-seed-from-bundle-logic|\bBP\b|\bBK\b|no-key stop|stop_no_key'
