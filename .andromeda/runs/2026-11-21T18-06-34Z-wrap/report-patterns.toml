[[pattern]]
id = 'RELIED'
regex = '28 relied|29 relied|28th relied|29th relied|relied (capability[- ])?ledger rows?|LedgerRow::relied|relied rows?'
ignore_case = true

[[pattern]]
id = 'FIXSET'
regex = 'fixtures/claude/2\.1\.328|32 files|33 files|recorded (2\.1\.328 )?(fixture )?set'
ignore_case = true

[[pattern]]
id = 'FLOOR'
regex = 'FLOOR_ROWS|every relied row but four'

[[pattern]]
id = 'XSESS'
regex = 'cross-session|cross_session|CrossSession|crossSessionInbound'

[[pattern]]
id = 'SENDER'
regex = 'verify-sender|print-mode sender|SendMessage|sender_prompt'

[[pattern]]
id = 'NAMESONLY'
regex = '--names-only|names-only capture|Tool\.<k>\.json'

[[pattern]]
id = 'XDG'
regex = 'XDG_RUNTIME_DIR|runtime dir'

[[pattern]]
id = 'UDS'
regex = 'uds_address|uds:|cc-socks'

[[pattern]]
id = 'STAMPS'
regex = 'ledger/stamps\.json|cross_session_probe|measured\.'

[[pattern]]
id = 'CAPTURE'
regex = '--capture'

[[pattern]]
id = 'DIRSPAWN'
regex = 'direct spawn'
ignore_case = true

[[pattern]]
id = 'RUNB'
regex = 'Run B'

[[pattern]]
id = 'RESIDUAL'
regex = 'accepted residual|residual'
ignore_case = true

[[pattern]]
id = 'KEPTSTAMP'
regex = 'kept stamp|cross-stamp|standing live rig|live rig'
ignore_case = true

[[pattern]]
id = 'SYNTH'
regex = 'synthetic probe|probe prompt|prompts synthetic|compiled literals'
ignore_case = true

[[pattern]]
id = 'ENVLOG'
regex = 'new env(ironment)? read|env read|Decisions Log'
ignore_case = true

[[pattern]]
id = 'SUBJECT'
regex = 'verify-spawn|verify-run|subject enum|diag-line\.v1'

[[pattern]]
id = 'FAKEREPLAY'
regex = 'fake agent|fake-agent'
ignore_case = true

[[pattern]]
id = 'AUTOVERIFY'
regex = 'auto_verify|automatic verify|start.s own verify'
ignore_case = true

[[pattern]]
id = 'TRANSCR'
regex = 'transcripts? (are|is )?(the )?accepted|accepted residual'
ignore_case = true

[[pattern]]
id = 'SCRUB'
regex = 'scrub|never a log, stamp or fixture|home-path'
ignore_case = true
