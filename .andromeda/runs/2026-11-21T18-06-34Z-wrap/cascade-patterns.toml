[[pattern]]
id = 'm-abspath'
regex = 'absolute paths?|any path|a path, the user word'
ignore_case = true

[[pattern]]
id = 'm-ninepairs'
regex = 'nine (verify )?spawn|nine pairs'
ignore_case = true

[[pattern]]
id = 'm-subjects'
regex = 'verify-pty-probe, agents-probe'

[[pattern]]
id = 'm-settings'
regex = 'consumed and ignored'
ignore_case = true

[[pattern]]
id = 'm-childset'
regex = 'six interactive PTY runs'
ignore_case = true
