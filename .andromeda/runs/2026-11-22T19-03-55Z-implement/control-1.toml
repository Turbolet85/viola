[[control]]
id = "stamp-shape"
entry = 7
guard = "attempted's shape check && swapped for ||"
case = "attempted_refuses_a_v1_document_of_a_failing_shape"
[[control.edit]]
path = "crates/viola-agent-claude/src/ledger.rs"
old = '''
pub fn attempted(stamps: &[u8], version: &str) -> Result<bool, AgentError> {
    let doc: Value = serde_json::from_slice(stamps).map_err(|_| AgentError::StampsMalformed)?;
    let shaped = doc
        .as_object()
        .is_some_and(|d| d.get("v").and_then(Value::as_u64) == Some(1) && stamp_shape_ok(d));
'''
new = '''
pub fn attempted(stamps: &[u8], version: &str) -> Result<bool, AgentError> {
    let doc: Value = serde_json::from_slice(stamps).map_err(|_| AgentError::StampsMalformed)?;
    let shaped = doc
        .as_object()
        .is_some_and(|d| d.get("v").and_then(Value::as_u64) == Some(1) || stamp_shape_ok(d));
'''

