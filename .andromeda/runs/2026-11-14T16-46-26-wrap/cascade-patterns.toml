[[pattern]]
id = 'main-gate'
regex = '(?i)budget[ -]gate|budget_eval|BudgetGate|budget governor|usage pause|budget pause'

[[pattern]]
id = 'main-paused'
regex = 'budget-paused|budget_paused|BudgetPaused|budget_override_until|override_until'

[[pattern]]
id = 'main-exit11'
regex = '(?i)\bexit(?:s| code| status)? 11\b|\b11 budget-paused|10–14|10-14|10/11'

[[pattern]]
id = 'main-budgetjson'
regex = 'budget\.json|read_budget|write_budget|StampedReading|BudgetReading|budget file'

[[pattern]]
id = 'main-relbudget'
regex = 'release --budget|budget: ?true|\{budget\?|"budget"|--budget'

[[pattern]]
id = 'main-ratelimits'
regex = 'statusline-rate-limits|rate_limits|rate-limits|StatusLineRateLimits|whole_rate_limits|rate limits'

[[pattern]]
id = 'main-thresholds'
regex = 'five_hour|seven_day|five-hour|seven-day|\bPercent\b|read_thresholds'

[[pattern]]
id = 'main-listbudget'
regex = '\{items, ?budget|BayBudget|BAY  5H|5H unknown|gate open'

[[pattern]]
id = 'main-path6'
regex = '(?i)\bpath ?6\b|path6|cli_budget'

[[pattern]]
id = 'main-anybudget'
regex = '(?i)budget'
