[[pattern]]
id = 'gate'
regex = '(?i)budget[ -]gate|budget_eval|BudgetGate|budget governor'

[[pattern]]
id = 'paused'
regex = 'budget-paused|budget_paused|BudgetPaused|budget_override_until|override_until'

[[pattern]]
id = 'exit11'
regex = '(?i)\bexit(?:s| code| status)? 11\b|\b11 budget-paused'

[[pattern]]
id = 'budgetjson'
regex = 'budget\.json|read_budget|write_budget|StampedReading|BudgetReading'

[[pattern]]
id = 'releasebudget'
regex = 'release --budget|budget: ?true|\{budget\?|"budget"'

[[pattern]]
id = 'ratelimits'
regex = 'statusline-rate-limits|rate_limits|rate-limits|StatusLineRateLimits|whole_rate_limits'

[[pattern]]
id = 'thresholds'
regex = 'five_hour|seven_day|five-hour|seven-day|\bPercent\b|read_thresholds|thresholds?'

[[pattern]]
id = 'listbudget'
regex = '\{items, ?budget|BayBudget|BAY  5H|5H unknown|gate open'

[[pattern]]
id = 'path6'
regex = '(?i)\bpath ?6\b|path6|cli_budget'

[[pattern]]
id = 'kinds16'
regex = '(?i)\b16\b[^.\n]{0,24}\bkinds\b|sixteen[^.\n]{0,24}\bkinds\b|EventKind::ALL'

[[pattern]]
id = 'rows24'
regex = '(?i)\b24\b[^.\n]{0,24}\brows\b|twenty-four[^.\n]{0,24}\brows\b|relied rows|LedgerRow::relied'

[[pattern]]
id = 'cfgkeys'
regex = 'CONFIG_KEYS'

[[pattern]]
id = 'startrec'
regex = '(?i)record (?:two|three)|start records|records 1.3'

[[pattern]]
id = 'vbump'
regex = 'protocol-version-bump-rule|bumps `?v`?'

[[pattern]]
id = 'wheel23'
regex = 'wheel-column-width-23|WHEEL_WIDTH'

[[pattern]]
id = 'replaylog'
regex = 'snapshot-replay-from-log'

[[pattern]]
id = 'anybudget'
regex = '(?i)budget'
