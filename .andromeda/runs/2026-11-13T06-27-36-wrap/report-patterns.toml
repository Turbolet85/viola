[[pattern]]
id = 'readiness'
regex = '(?i)input[- ]box (literal|signature)|footer literal|for agents|shift\+tab to cycle|SIGNATURES|input_box_up|input_box_ready|BOX_RULE_MIN'

[[pattern]]
id = 'sigrows'
regex = '(?i)signature[- ]rows?|signature_rows|Screen\.<phase>\.json|screen fixture'

[[pattern]]
id = 'boxwait'
regex = '(?i)box[ _]wait|verify-box-wait'

[[pattern]]
id = 'advisories'
regex = '(?i)ignore = \[\]|no advisory is ignored|no-ignored-advisor|ignored advisor|RUSTSEC-2026-04(57|61|62)'

[[pattern]]
id = 'rustix'
regex = '(?i)rustix'

[[pattern]]
id = 'typedprobe'
regex = 'typed_probe|box_only_guards'

[[pattern]]
id = 'siglits'
regex = '(?i)SIGNATURE_LITERALS|four compiled literals'

[[pattern]]
id = 'owner-title'
fixed = 'Verify readiness on the input box'
ignore_case = true

[[pattern]]
id = 'owner-generic'
regex = 'owned by a (route entry|CARRY)'
ignore_case = true

[[pattern]]
id = 'advisories2'
regex = '(?i)advisor(y|ies) ignore|no (dependency )?advisory|cve-sla|critical cve|exact-third-party-pins|rmcp'

[[pattern]]
id = 'clivers'
regex = '2\.1\.3(02|12|19|22|23)|newest (installed )?(claude|CLI)'
