[[control]]
id = "fds-held-red"
entry = 16
guard = "the absence of a hold: the fake keeps hooks.json open for its life from the head of launch"
case = "tui_channel_fds_the_child_holds_nothing_of_violas"

[[control.edit]]
path = "src/bin/viola-fake-agent.rs"
old = '''fn launch(agent: &Agent) {
'''
new = '''fn launch(agent: &Agent) {
    if let Some(d) = agent.opts.plugin_dir.as_ref() {
        if let Ok(f) = fs::File::open(d.join("hooks").join("hooks.json")) {
            std::mem::forget(f);
        }
    }
'''
