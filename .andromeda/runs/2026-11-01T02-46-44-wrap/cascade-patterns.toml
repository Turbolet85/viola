[[pattern]]
id = "gap-marks"
regex = '''(reading|wording) is PROVISIONAL · owner|OPEN — this (reading|wording)'''

[[pattern]]
id = "owed-word"
regex = '''PROVISIONAL, owed the founder|owed the founder's own word|PROVISIONAL word'''

[[pattern]]
id = "not-ruled"
regex = '''not ruled by the founder|founder not having ruled|founder has not ruled|operator's word and'''

[[pattern]]
id = "delegate-word"
regex = '''delegate overseer|the delegate's word'''

[[pattern]]
id = "paren-mark"
regex = '''\(PROVISIONAL\)'''

[[pattern]]
id = "socket-mark"
regex = '''(refusal's code|has no code), PROVISIONAL'''

[[pattern]]
id = "planning-word"
regex = '''operator's answer at its planning|approved by the operator at P5'''

[[pattern]]
id = "d07-spelling"
regex = '''dialog_id` is known, (obs-plan )?D-07'''

[[pattern]]
id = "open-decisions"
regex = '''unwrapped-name reading|after-every-test reading|wording of the `endpoint-lost` hint|tells a dead instance from an unwrapped'''
