id = 'F1-bt-line'
regex = '''browser-tools prompt stood at start|answer it once in claude|BROWSER_TOOLS_STOOD|browser_tools_stood|browser-tools (line|prompt line)'''
ignore_case = true

[[pattern]]
id = 'F2-rig-arms'
regex = '''\bL1-2\b|`vh`|`cx`|\bArm::(VH|CX)\b|--target-home|--claude-dir|\bVH arm\b|\bCX arm\b'''

[[pattern]]
id = 'F3-328-stamp'
regex = '''2\.1\.328'''

[[pattern]]
id = 'F5-context'
regex = '''/context\b|context-post|context-transcript'''

[[pattern]]
id = 'F6-mcp-disable'
regex = '''/mcp disable|disabledMcpServers|disabled-mcp'''

[[pattern]]
id = 'F7-real-home'
regex = '''real home|real-home|founder's real|real Claude config'''
ignore_case = true
