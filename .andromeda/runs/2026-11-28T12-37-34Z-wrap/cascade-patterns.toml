# Main's own cascade patterns — the OLD wording and mechanism of each amended passage, whole masters

# console-frame logged on every draw (now: the first draw, then a change of its five fields)
[[pattern]]
id = 'm-frame-draw'
regex = '''once per draw|every draw logs|one console-frame (line )?(a|per) draw'''

# the console as «no verb's output» (now: its own surface, governed by no verb-output rule)
[[pattern]]
id = 'm-no-verb'
regex = '''no verb's output'''

# the console redrawing only on a resize (now: or a change in the fleet it shows)
[[pattern]]
id = 'm-resize-only'
regex = '''redraws (its frame )?(on a resize|when the terminal's size changes)'''

# the console's refusal writing no line (now: at its start; mid-run one process-exit line)
[[pattern]]
id = 'm-console-noline'
regex = '''viola console[^.]{0,120}(no line|writing no line)'''

# the agents read's named callers without the console
[[pattern]]
id = 'm-agents-callers'
regex = '''viola list and viola revive do not gate|and the MCP list tool resolve claude|and the list tool of viola mcp into'''
