[[control]]
id = 'fs-trust'
entry = 5
guard = "the first-screen classifier's trust arm removed: a trust row falls down the arms"
case = 'verify_first_screens_read_trust_then_box_on_the_fake'

[[control.edit]]
path = 'crates/viola-agent-claude/src/screen.rs'
old = '''        if self.modals.first().is_some_and(|m| holds(m)) {
            FirstScreen::Trust
        } else if self.modals.get(1).is_some_and(|m| holds(m)) {'''
new = '''        if self.modals.get(1).is_some_and(|m| holds(m)) {'''

[[control]]
id = 'fs-record'
entry = 5
guard = "the line storing Run F's first-screen reading removed"
case = 'verify_first_screens_read_trust_then_box_on_the_fake'

[[control.edit]]
path = 'src/cmd/verify/typed/runs.rs'
old = '''        typed.first[5] = run.end_by_kill();'''
new = '''        run.end_by_kill();'''

[[control]]
id = 'fs-boxany'
entry = 3
guard = "the box_any reader's rule-row arm removed"
case = 'first_screen_facts_count_rows_and_any_box_literal::case_2_rule_alone'

[[control.edit]]
path = 'crates/viola-agent-claude/src/screen.rs'
old = '''                .any(|r| self.is_box_rule(r) || r.starts_with(self.box_prompt))'''
new = '''                .any(|r| r.starts_with(self.box_prompt))'''

[[control]]
id = 'rig-gitroot'
entry = 5
guard = "the V arm's git-root layout step's body removed: nothing written"
case = 'rig_rehearsal_v_reads_the_trust_record_row_and_no_record_left'

[[control.edit]]
path = 'crates/viola-e2e/src/rig/isolate.rs'
old = '''        let git = self.cwd.join(".git");
        create_private_dir(&git)?;
        create_private_dir(&git.join("objects"))?;
        create_private_dir(&git.join("refs"))?;
        replace_private(&git.join("HEAD"), b"ref: refs/heads/main\n", FILE_MODE)
            .map_err(|_| io::Error::other("git layout failed"))'''
new = '''        Ok(())'''
