[[control]]
id = 'shape-off'
entry = 4
guard = 'option_shaped always returns false (step 1)'
case = 'option_shape_a_shaped_label_with_the_box_below_still_refuses'

[[control.edit]]
path = 'crates/viola-agent-claude/src/screen.rs'
old = '''        ends_on_label(selected) || numbered.is_some_and(ends_on_label)'''
new = '''        false && (ends_on_label(selected) || numbered.is_some_and(ends_on_label))'''

[[control]]
id = 'shape-off-e2e'
entry = 8
guard = 'option_shaped always returns false (step 1), read on the E2E refusal'
case = 'send_on_a_verified_cli_refuses_while_the_browser_tools_prompt_is_up'

[[control.edit]]
path = 'crates/viola-agent-claude/src/screen.rs'
old = '''        ends_on_label(selected) || numbered.is_some_and(ends_on_label)'''
new = '''        false && (ends_on_label(selected) || numbered.is_some_and(ends_on_label))'''

[[control]]
id = 'below-off'
entry = 5
guard = 'box_below always returns true (step 2)'
case = 'box_below_a_quoted_label_without_the_box_below_still_refuses'

[[control.edit]]
path = 'crates/viola-agent-claude/src/screen.rs'
old = '''        rows.get(i + 1..).is_some_and(|below| self.holds_box(below))'''
new = '''        true || rows.get(i + 1..).is_some_and(|below| self.holds_box(below))'''

[[control]]
id = 'raw-presence'
entry = 9
guard = 'standing_modal reads any row holding a label, as before the mend (step 3)'
case = 'send_on_a_verified_cli_goes_past_a_quoted_modal_label'

[[control.edit]]
path = 'crates/viola-agent-claude/src/screen.rs'
old = '''            self.holds_modal(row) && (self.option_shaped(row) || !self.box_below(rows, i))'''
new = '''            self.holds_modal(row) && (true || self.option_shaped(row) || !self.box_below(rows, i))'''
