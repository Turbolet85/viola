[[control]]
id = 'rec-hiddengate'
entry = 5
guard = 'the hidden --record-first-screens gate on the failed-verify first-screen writer, made always true'
case = 'verify_record_on_a_failed_run_writes_no_screen_without_the_rig_option'

[[control.edit]]
path = 'src/cmd/verify.rs'
old = '''        if let (Some(dir), true) = (&args.record, args.record_first_screens)'''
new = '''        if let (Some(dir), true) = (&args.record, true)'''
