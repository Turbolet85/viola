[[control]]
id = "flush-out"
entry = 6
guard = "SharedOutput::flush's inner flush made Ok(())"
case = "pump_flushes_the_host_output_after_each_copy"
[[control.edit]]
path = "crates/viola-pty/src/pump.rs"
old = '''    fn flush(&mut self) -> io::Result<()> {
        self.0
            .lock()
            .unwrap_or_else(PoisonError::into_inner)
            .flush()
    }'''
new = '''    fn flush(&mut self) -> io::Result<()> {
        Ok(())
    }'''

