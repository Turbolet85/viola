[[control]]
id = "up-skip-live"
entry = 4
guard = "the Live / Stale arm that skips before the candidate test"
case = ["up_plan_skips_a_live_or_stale_instance::case_2_live", "up_plan_skips_a_live_or_stale_instance::case_5_stale"]

[[control.edit]]
path = "src/cmd/up.rs"
old = '''
    match reading.liveness {
        Liveness::Live => return Pick::Skip(Outcome::AlreadyLive),
        Liveness::Stale => return Pick::Skip(Outcome::StaleHeartbeat),
        Liveness::Gone => {}
    }
'''
new = '''
    let _ = reading.liveness;
'''

[[control]]
id = "up-order"
entry = 4
guard = "the parent-first ordering of the candidates"
case = "up_plan_orders_parents_before_children::case_1_a_child_sorted_first"

[[control.edit]]
path = "src/cmd/up.rs"
old = '''let roots = (0..names.len()).filter(|&at| parent_of(at).is_none());'''
new = '''let roots = 0..names.len();'''

[[control]]
id = "up-boot"
entry = 4
guard = "the beat_before test on an unnamed candidate"
case = "up_plan_takes_only_a_beat_older_than_the_boot::case_2_unnamed_this_boot"

[[control.edit]]
path = "src/cmd/up.rs"
old = '''        reading.beat_before && !reading.ended'''
new = '''        !reading.ended'''

[[control]]
id = "up-ended"
entry = 4
guard = "the ended_after_last_start test on an unnamed candidate"
case = "up_plan_leaves_out_an_instance_ended_after_its_last_start::case_1_unnamed_ended"

[[control.edit]]
path = "src/cmd/up.rs"
old = '''        reading.beat_before && !reading.ended'''
new = '''        reading.beat_before'''
