# The close's site sweep — one pattern per moved fact of the report (Counts / qualifiers moved, Spec claims
# disproved, Expected amendments), each with the fact's name token as one more alternative.

[[pattern]]
id = 'kinds16'
regex = 'normalised event kinds|15 (event )?kinds|EventKind::ALL'

[[pattern]]
id = 'startrecs'
regex = 'lines 1 and 2|then session-start|then the agent.s session-start|first record of a start|start_records|record two'

[[pattern]]
id = 'replay3'
regex = 'Replayed|three (recovered )?fields|recovered fields|replay recovers'

[[pattern]]
id = 'itemkeys'
regex = '8 keys|eight keys|8 fields|eight fields|cli_verified'

[[pattern]]
id = 'oklinks'
regex = '"items"|ok\.items|ok\.links|"skipped"'

[[pattern]]
id = 'rec2readers'
regex = 'path1_session_start_is_record_two_through_the_absolute_hook|path1_session_start'

[[pattern]]
id = 'lineage'
regex = '\blineage\b'
ignore_case = true

[[pattern]]
id = 'wake'
regex = 'WAIT_WAKE|wake kinds|log-only'

[[pattern]]
id = 'parentflag'
regex = '--parent|--role|\bparent\b'

[[pattern]]
id = 'sixcols'
regex = 'six (fixed )?columns|6 columns|six captions|list-six-fixed-columns'

[[pattern]]
id = 'linksblock'
regex = 'LINKS|link column|no-link-column'

[[pattern]]
id = 'nameorder'
regex = 'ordered by name|name order|by name|board-ordered-by-name'

[[pattern]]
id = 'fromself'
regex = 'self-reported|authenticates nothing|from-field-authenticates-nothing'

[[pattern]]
id = 'homeres'
regex = 'home resolution|cli-home-resolution-order|VIOLA_NAME'

[[pattern]]
id = 'arrow'
regex = 'ASCII arrow|ascii-arrow|transfer arrow'
ignore_case = true

[[pattern]]
id = 'sourcerole'
regex = 'instance-source-per-role|source per role'
