[[control]]
id = 'wake-count'
entry = 5
guard = "the session_crons length in data_of's Stop arm, written null"
case = [
  'turn_ended_scheduled_wakes_counts_the_session_crons_array::case_1_empty',
  'turn_ended_scheduled_wakes_counts_the_session_crons_array::case_2_two',
  'turn_ended_scheduled_wakes_counts_the_session_crons_array::case_3_not_objects',
]

[[control.edit]]
path = 'crates/viola-agent-claude/src/hook.rs'
old = '''            "scheduled_wakes": known.session_crons.map(|crons| crons.len()),'''
new = '''            "scheduled_wakes": null,'''

[[control]]
id = 'wake-drift'
entry = 5
guard = "session_crons in known_fields' array arm: its drift word then reads string"
case = [
  'turn_ended_scheduled_wakes_is_null_when_absent_or_not_an_array::case_3_string',
  'turn_ended_scheduled_wakes_is_null_when_absent_or_not_an_array::case_4_object',
  'turn_ended_scheduled_wakes_is_null_when_absent_or_not_an_array::case_5_number',
]

[[control.edit]]
path = 'crates/viola-agent-claude/src/hook.rs'
old = '''        let expected = if path == "background_tasks" || path == "session_crons" {'''
new = '''        let expected = if path == "background_tasks" {'''

[[control]]
id = 'wake-key'
entry = 9
guard = "scheduled_wakes in TurnEnded's data_keys: the reader then counts it unknown"
case = 'state_events_scheduled_wakes_is_a_known_key'

[[control.edit]]
path = 'crates/viola-core/src/lib.rs'
old = '''                "scheduled_wakes",
                "cause",
            ],
            Self::SessionEnd => &[],'''
new = '''                "cause",
            ],
            Self::SessionEnd => &[],'''
