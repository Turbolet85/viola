[[control]]
id = "text-fold"
entry = 7
guard = "the editing mode's per-read fold (each char its own text line)"
case = "console::tests::editing_a_read_of_text_writes_one_text_line"

[[control.edit]]
path = "src/console/mod.rs"
old = '''
                    text.push(c);
                    fold.text += 1;
'''
new = '''
                    text.push(c);
                    obs_event!(INFO, ObsEvent::ConsoleKey, key = "text", count = 1u64);
'''

[[control]]
id = "flag-value"
entry = 7
guard = "the = form of a switch word (--model and the word as two elements)"
case = "console::action::tests::action_switch_words_are_values_never_flags"

[[control.edit]]
path = "src/console/action.rs"
old = '''
            .map(|word| {
                if viola_agent_claude::is_effort_level(word) {
                    format!("--effort={word}")
                } else {
                    format!("--model={word}")
                }
            })
'''
new = '''
            .flat_map(|word| {
                if viola_agent_claude::is_effort_level(word) {
                    vec!["--effort".to_owned(), word.to_owned()]
                } else {
                    vec!["--model".to_owned(), word.to_owned()]
                }
            })
'''
