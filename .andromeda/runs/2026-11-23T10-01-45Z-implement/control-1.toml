[[control]]
id = 'launch-last-wins'
entry = 7
guard = 'the replace in apply_launch_line: a held pair is kept, so the first launch line wins'
case = ['launch_rule_the_last_line_wins']

[[control.edit]]
path = 'crates/viola-state/src/replay.rs'
old = '''    *launch = match (data["model"].as_str(), data["effort"].as_str()) {'''
new = '''    if launch.is_some() {
        return;
    }
    *launch = match (data["model"].as_str(), data["effort"].as_str()) {'''

[[control]]
id = 'caller-words'
entry = 8
guard = 'the names_pair refusal in checked(): a model or an effort after -- passes'
case = ['run_args_refuse_a_pair_in_the_callers_words']

[[control.edit]]
path = 'src/cmd/run.rs'
old = '''    if run::launch::names_pair(&args.program) {
        return Err(pair_after_dashes());
    }
    Ok(args)'''
new = '''    Ok(args)'''

[[control]]
id = 'revive-pair'
entry = 10
guard = 'the recorded half handed into Launch.given: only the overrides are handed, none in the recorded place'
case = ['revive_hands_the_recorded_pair']

[[control.edit]]
path = 'src/cmd/revive.rs'
old = '''    let given = given_pair((args.model, args.effort), &recovered);'''
new = '''    let given = (args.model, args.effort);'''
