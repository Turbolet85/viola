[[control]]
id = 'pr-question-arm'
entry = 3
guard = 'the (PermissionRequest, Question) arm of decision_body removed: a question on PermissionRequest falls to the no-decision arm'
case = 'decision_body_question_on_permission_request_is_allow_with_updated_input'

[[control.edit]]
path = 'crates/viola-agent-claude/src/dialog.rs'
old = '''
        (
            HookEvent::PermissionRequest,
            Response::Question {
                answers,
                annotations,
            },
        ) => permission_decision(
            "allow",
            None,
            Some(answered_input(input, answers, annotations.as_ref())),
        ),
'''
new = '''
'''
