[[control]]
id = 'pq-row-answers'
entry = 9
guard = 'the clause of question_permission_answered that compares tool_response.answers with the first labels removed: any PostToolUse of the call reads answered'
case = 'check_permission_request_question_fails_when::case_4_answers_differ'

[[control.edit]]
path = 'crates/viola-agent-claude/src/ledger.rs'
old = '''
    let answered = post
        .and_then(|c| c.payload.as_ref())
        .is_some_and(|p| first_labels_answered(input, &p["tool_response"]["answers"]));
'''
new = '''
    let answered = post.and_then(|c| c.payload.as_ref()).is_some();
'''
