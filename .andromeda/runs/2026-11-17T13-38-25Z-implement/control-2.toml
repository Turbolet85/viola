[[control]]
id = 'vfy-term'
entry = 8
guard = "the stamping verify's SIGTERM parent-death signal replaced by SIGKILL, today's signal"
case = 'killed_test_leaves_no_stamping_verify'

[[control.edit]]
path = 'crates/viola-e2e/src/harness/boot.rs'
old = 'tie_to_caller(&mut verify, libc::SIGTERM);'
new = 'tie_to_caller(&mut verify, libc::SIGKILL);'

[[control]]
id = 'vfy-tie'
entry = 8
guard = "stamp's tie_to_caller call removed: the stamping verify untied"
case = 'killed_test_leaves_no_stamping_verify'

[[control.edit]]
path = 'crates/viola-e2e/src/harness/boot.rs'
old = '''    if opts.tied {
        tie_to_caller(&mut verify, libc::SIGTERM);
    }
'''
new = ''

[[control]]
id = 'e2e-census'
entry = 8
guard = "options()'s tied: true in harness_lifecycle.rs reverted to tied: false"
case = 'viola_e2e_census_finds_no_untied_boot'

[[control.edit]]
path = 'crates/viola-e2e/tests/harness_lifecycle.rs'
old = '        tied: true,'
new = '        tied: false,'
