[[control]]
id = 'fleet-cut'
entry = 6
guard = 'the cut of a line past the width (the line returned whole)'
case = 'fleet_cut_past_the_width_ends_in_dots::case_1_past_the_width'

[[control.edit]]
path = 'src/human/fleet.rs'
old = '    cut(line, columns)'
new = '    line.to_owned()'

[[control]]
id = 'fleet-escape'
entry = 6
guard = 'the escape_row call on a cell (the cell raw)'
case = 'fleet_cells_escape_every_control_character'

[[control.edit]]
path = 'src/human/fleet.rs'
old = '.map(|c| escape_row(c))'
new = '.map(|c| c.clone())'

[[control]]
id = 'view-redraw'
entry = 6
guard = 'the view comparison in the redraw test (size alone)'
case = 'console_run_redraws_when_the_view_changes'

[[control.edit]]
path = 'src/console/mod.rs'
old = '        if (size, &view) != (drawn.0, &drawn.1) {'
new = '        if size != drawn.0 {'
