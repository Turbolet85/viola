[[control]]
id = 'stamp-hollow'
entry = 4
guard = "stamp_counts' completion-file and stamps-file check replaced by is_dir() alone (the old rule)"
case = 'stamped_home_rebuilds_a_stamp_restored_without_its_files'

[[control.edit]]
path = 'tests/support/home.rs'
old = '''    stamp.join(STAMPED).is_file() && stamp.join("home/ledger/stamps.json").is_file()'''
new = '''    stamp.is_dir()'''

[[control]]
id = 'tied-pdeath'
entry = 5
guard = "tie's prctl(PR_SET_PDEATHSIG, SIGKILL) call removed"
case = 'killed_test_leaves_no_piped_wrapper'

[[control.edit]]
path = 'tests/support/tied.rs'
old = '''            if libc::prctl(libc::PR_SET_PDEATHSIG, libc::SIGKILL) != 0 {
                return Err(std::io::Error::last_os_error());
            }
'''
new = ''

[[control]]
id = 'sup-tied'
entry = 6
guard = "spawn_supervisor's tied branch (its pre_exec tie) removed"
case = 'killed_test_leaves_no_harness_session'

[[control.edit]]
path = 'crates/viola-e2e/src/harness/boot.rs'
old = '''    if tied {
        tie_to_caller(&mut supervisor);
    }
'''
new = ''
