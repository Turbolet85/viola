[[pattern]]
id = 'kinds'
regex = 'normalised-event-kinds|EventKind::ALL|KIND_TABLE|every_kind'

[[pattern]]
id = 'startrec'
regex = '\bthree (start )?records\b|\b3 (start )?records\b|start_records|run-start-events|wheel[^.\n]{0,60}lineage[^.\n]{0,60}session-start'

[[pattern]]
id = 'cfgkeys'
regex = '\bfive (known )?keys\b|\b5 (known )?keys\b|CONFIG_KEYS|known-keys|known keys'

[[pattern]]
id = 'listitem'
regex = 'list-payload/items|list-item|viola-list-json/items'

[[pattern]]
id = 'receipt'
regex = 'fake-agent-receipt|start receipt'

[[pattern]]
id = 'bounded'
regex = 'contract_bounded_readers|BOUNDARIES'

[[pattern]]
id = 'nolaunch'
regex = 'replays no launch|revive-resumes-in-place|launch spec'

[[pattern]]
id = 'revreplay'
regex = 'revive[^.\n]{0,80}(replayed|corrupt) snapshot|(replayed|corrupt) snapshot[^.\n]{0,80}revive|revive-refused-without-cwd'

[[pattern]]
id = 'pair'
regex = 'default_model|default_effort|DEFAULT_PAIR|--model|--effort|child-argv|config-json/'

[[pattern]]
id = 'flaglit'
ignore_case = true
regex = 'claude-flag-literals|flag literals'

[[pattern]]
id = 'reviveusage'
regex = 'viola-revive/usage'

[[pattern]]
id = 'secsib'
regex = 'run-lineage-flags-checked|lineage-kept-to-snapshot-and-event-log|lineage-parent-authenticates-nothing|board-lineage-and-links-name-checked|session-id-argv-closed-shape'

[[pattern]]
id = 'snaprows'
regex = 'instance-snapshot/|snapshot-replay-log-fields-only|snapshot-envelope/unreadable-snapshot|snapshot-replay-fields|wrapper-events-log-only|decision/revive-in-place|product-order-from-events-log|lineage-line-untraced|boot-readiness/events|event-data/lineage'
