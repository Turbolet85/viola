[[pattern]]
id = 'main-termpair'
regex = '''subject:\s*"terminal"`?\s*`?process-start`?\s*/\s*`?process-exit|process-exit\{subject:"terminal"\}|terminal window it spawns|pair of the foot terminal window|and for the terminal viola open spawns'''

[[pattern]]
id = 'main-setup'
regex = '''open, run, revive, verify|run, revive, verify, plugin install'''

[[pattern]]
id = 'main-nowindow'
regex = '''revive never places a window|revive[^\n]{0,40}no window step|replays no workspace'''

[[pattern]]
id = 'main-everybound'
regex = '''[Ee]very time bound'''

[[pattern]]
id = 'main-cwdonly'
regex = '''cwd[^\n]{0,60}only in the 0600 snapshot|spawn directory lives only'''
