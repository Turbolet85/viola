# Phase 1 site sweep — one pattern per moved fact of 2026-11-15-api-error-turn-end's report
[[pattern]]
id = 'hookcount'
regex = '''\b(nine|ten|9|10) (registered )?(hook )?events\b|\bone of (nine|ten)\b|StopFailure|stop-failure|HookEvent::ALL'''

[[pattern]]
id = 'tekeys'
regex = '''turn-ended-last-assistant-message|data_keys|turn-ended`?[^.\n]{0,80}background_tasks'''

[[pattern]]
id = 'witness'
regex = '''every-event witness|hook receipts|hook_events'''

[[pattern]]
id = 'turncause'
regex = '''TurnEndCause|UnreachableCause|closed cause'''

[[pattern]]
id = 'hkmap'
regex = '''hook-to-kind'''

[[pattern]]
id = 'revalid'
regex = '''hook-event-revalidation|hook_event_line'''

[[pattern]]
id = 'capgate'
regex = '''capability-ledger-gate|no ledger row'''

[[pattern]]
id = 'fakeagent'
regex = '''REGISTERED_EVENTS|fake agent[^.\n]{0,60}regist'''
