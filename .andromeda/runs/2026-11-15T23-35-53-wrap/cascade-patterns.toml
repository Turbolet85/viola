# main's own cascade patterns — the amended claims' old wording and mechanism, every master and leaf
[[pattern]]
id = 'm-nineev'
regex = '''\b(nine|9) (registered )?(hook )?events\b|\bone of nine\b|\b9 registered\b'''

[[pattern]]
id = 'm-tekeys'
regex = '''turn-ended`?[^.\n]{0,80}(last_assistant_message|background_tasks)'''

[[pattern]]
id = 'm-spine'
regex = '''SessionStart, UserPromptSubmit and Stop'''

[[pattern]]
id = 'm-ledger'
regex = '''every (relied|load-bearing)[^.\n]{0,60}(ledger|row)|single gate'''
