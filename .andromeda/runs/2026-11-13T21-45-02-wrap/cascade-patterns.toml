[[pattern]]
id = 'm-symlink-unwrap'
regex = 'regular file or a symlink|symlink(ed)?[^.]{0,60}unwrapped-name'
ignore_case = true

[[pattern]]
id = 'm-class-list'
fixed = 'absolute-path, username, schema'
ignore_case = true

[[pattern]]
id = 'm-key-resize'
regex = 'key is written after a resize|key after (a|the) resize'
ignore_case = true

[[pattern]]
id = 'm-every-payload'
regex = 'every (channel, )?hook and MCP payload type derives|payload types derive veil'
ignore_case = true

[[pattern]]
id = 'm-logs-0600'
regex = 'event log and diagnostics files are 0600'
ignore_case = true

[[pattern]]
id = 'm-hint-shared'
regex = 'hint:. line keyed by the reason'
ignore_case = true
