[[pattern]]
id = 'owner-title'
fixed = 'Unix endpoint and home hardening'
ignore_case = true

[[pattern]]
id = 'owner-generic'
regex = 'owned by a (route entry|CARRY)'
ignore_case = true

[[pattern]]
id = 'causes'
regex = '(five|six|5|6) (closed )?(exit-21 )?(cause|word)s?\b|five closed|closed causes?|UnreachableCause|socket-dir-refused'
ignore_case = true

[[pattern]]
id = 'revive-codes'
regex = '(ten|eleven|10|11) (closed )?codes?\b|batch-script-child'
ignore_case = true

[[pattern]]
id = 'detail-enums'
regex = '(detail|enum)[^.|]{0,60}\b(19|7) (member|value|word|code)s?|\b(19|7) (member|value|word|code)s?[^.|]{0,60}(detail|enum)'
ignore_case = true

[[pattern]]
id = 'verify-word'
regex = 'server-verify-failed[^.|]{0,80}(off macOS|Linux and Windows)|off macOS'
ignore_case = true

[[pattern]]
id = 'socket-dir'
regex = 'check_socket_dir|check_endpoint_dir|socket_dir_verdict|socket[- ]director(y|ies)'
ignore_case = true

[[pattern]]
id = 'peer-euid'
regex = 'peer_euid|peer_admitted|server_euid|peer euid|client euid|euid check|peer_creds'
ignore_case = true

[[pattern]]
id = 'board-rule'
regex = '''board::scan|ScanRefused|board's (two|one) (home )?rules?|two rules'''
ignore_case = true

[[pattern]]
id = 'cleanup'
regex = 'holder_gone|unconnectable|endpoint_gone|force-killed wrapper'
ignore_case = true

[[pattern]]
id = 'refuse-census'
fixed = 'human::refuse'

[[pattern]]
id = 'kill-line'
regex = 'kill line'
ignore_case = true

[[pattern]]
id = 'perf-rows'
regex = '2\.4.{0,6}3\.3 ms|five hook rows'
ignore_case = true

[[pattern]]
id = 'threat-sock'
regex = 'viola-<h12>\.sock'

[[pattern]]
id = 'neg-binary'
regex = 'security_negatives_socket_dir|security_negatives_server_identity'

[[pattern]]
id = 'tempdir'
regex = 'tempfile::tempdir|bare temp[- ]?dir|tempfile. 3\.27'
ignore_case = true

[[pattern]]
id = 'mac-gap'
regex = 'macOS[^.|]{0,80}(pid|carve-out|gap)|carve-out[^.|]{0,80}macOS'
ignore_case = true

[[pattern]]
id = 'not-a-dir'
regex = 'Refused::|NotADirectory'

[[pattern]]
id = 'accept-loop'
regex = 'accept_loop|accept thread'
ignore_case = true
