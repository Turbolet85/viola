case = 'rig_ends_what_it_starts_on_every_exit_path'

[[control.edit]]
path = 'crates/viola-e2e/src/rig/procs.rs'
old = '''pub fn sweep(scope: Scope<'_>) -> (usize, usize) {
    let found = census(scope);'''
new = '''pub fn sweep(scope: Scope<'_>) -> (usize, usize) {
    if true {
        return (0, 0);
    }
    let found = census(scope);'''

