# Plan step 14: the four remove-the-guard controls, each case as nextest prints its name (the binary id
# the plan writes before it is the line's own field, which the tool reads apart).

[[control]]
id = "oversize"
entry = 15
guard = "the length check ahead of the parse in crates/viola-hyprland/src/reply.rs"
case = "reply::tests::parse_clients_takes_max_frame_bytes_and_refuses_one_more_as_oversize"

[[control.edit]]
path = "crates/viola-hyprland/src/reply.rs"
old = '''fn json(bytes: &[u8]) -> Result<Value, HyprlandError> {
    if bytes.len() as u64 > MAX_FRAME {
        return Err(HyprlandError::Oversize);
    }
    serde_json::from_slice(bytes)'''
new = '''fn json(bytes: &[u8]) -> Result<Value, HyprlandError> {
    serde_json::from_slice(bytes)'''

