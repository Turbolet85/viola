[[control]]
id = "drain-cap"
entry = 6
guard = "the cap on the hyprctl stdout drain (MAX_FRAME + 1 -> u64::MAX)"
case = "read_of_a_reply_twice_the_cap_keeps_one_byte_past_it_and_is_oversize"

[[control.edit]]
path = "crates/viola-hyprland/src/read.rs"
old = 'drain(child.stdout.take(), MAX_FRAME + 1)'
new = 'drain(child.stdout.take(), u64::MAX)'

[[control]]
id = "deadline-5s"
entry = 6
guard = "the settled 5 s bound on HYPRCTL_DEADLINE (5 s -> 1 s)"
case = "read_against_the_deadline_returns_unreachable_no_sooner_than_five_seconds"

[[control.edit]]
path = "crates/viola-hyprland/src/read.rs"
old = 'pub const HYPRCTL_DEADLINE: Duration = Duration::from_secs(5);'
new = 'pub const HYPRCTL_DEADLINE: Duration = Duration::from_secs(1);'

[[control]]
id = "monitors-keep-none"
entry = 8
guard = "the default refusal for monitors in the tap's keep-list (a monitors-keeps-all arm added ahead of the default)"
case = "record_keeps_no_monitors_string"

[[control.edit]]
path = "crates/viola-e2e/src/bin/viola-hypr-tap.rs"
old = '''        ("version", "tag") => HyprlandVersion::from_tag(value).is_some(),
        _ => false,'''
new = '''        ("version", "tag") => HyprlandVersion::from_tag(value).is_some(),
        ("monitors", _) => true,
        _ => false,'''
