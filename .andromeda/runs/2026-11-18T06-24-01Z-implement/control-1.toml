entry = 5
guard = "the VC arm's stop switched from stop_no_key to stop (the Ctrl-C presses)"
case = 'rig_rehearsal_vc_reads_its_first_frame_at_80x24_and_stops_with_no_key'

[[control.edit]]
path = 'crates/viola-e2e/src/rig/mod.rs'
