[[control]]
id = 'survey-flag'
entry = 6
guard = "Observed's flag check: the survey match taken with the flag down"
case = ['observed_a_survey_key_without_the_flag_takes_the_wheel', 'observed_a_survey_key_after_the_flag_falls_takes_the_wheel']

[[control.edit]]
path = 'src/run/wheel.rs'
old = '''        survey_answer(bytes) && self.survey.as_ref().is_some_and(SurveyFlag::standing)'''
new = '''        survey_answer(bytes)'''

[[control]]
id = 'survey-exact'
entry = 6
guard = "survey_answer's exact-length bound: a read that starts with a survey key is taken"
case = [
  'observed_a_neighbour_of_a_survey_key_under_the_flag_takes_the_wheel::case_10_two_zeros',
  'observed_a_neighbour_of_a_survey_key_under_the_flag_takes_the_wheel::case_11_zero_then_a_letter',
  'observed_a_neighbour_of_a_survey_key_under_the_flag_takes_the_wheel::case_12_three_then_zero',
  'observed_a_neighbour_of_a_survey_key_under_the_flag_takes_the_wheel::case_13_ctrl_c_after_a_digit',
  'observed_a_neighbour_of_a_survey_key_under_the_flag_takes_the_wheel::case_14_enter_after_a_digit',
  'observed_a_neighbour_of_a_survey_key_under_the_flag_takes_the_wheel::case_18_zero_with_a_trailing_esc',
]

[[control.edit]]
path = 'src/run/wheel.rs'
old = '''    bytes.len() == 1 && SURVEY.keys.contains(&bytes[0])'''
new = '''    bytes.first().is_some_and(|b| SURVEY.keys.contains(b))'''

[[control]]
id = 'survey-poison'
entry = 6
guard = "the feed thread's false on a poisoned model: the flag keeps its last value"
case = 'feed_panic_clears_the_survey_flag'

[[control.edit]]
path = 'src/run/gate.rs'
old = '''        if model.screen.is_poisoned() || model.overflowed {
            self.survey.store(false, Ordering::SeqCst);
            return;
        }'''
new = '''        if model.screen.is_poisoned() || model.overflowed {
            return;
        }'''

[[control]]
id = 'survey-options'
entry = 5
guard = "survey_standing's options-row literal check: the prompt literal alone stands"
case = [
  'survey_standing_reads_both_literals_and_no_poison::case_2_prompt_only',
  'survey_standing_reads_both_literals_and_no_poison::case_7_options_with_the_not_sure_cell',
]

[[control.edit]]
path = 'crates/viola-agent-claude/src/screen.rs'
old = '''        rows.iter().any(|r| r.contains(SURVEY.prompt))
            && rows.iter().any(|r| r.contains(SURVEY.options))'''
new = '''        rows.iter().any(|r| r.contains(SURVEY.prompt))'''
