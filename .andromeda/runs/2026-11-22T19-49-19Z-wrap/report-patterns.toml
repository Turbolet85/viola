[[pattern]]
id = 'abort'
regex = '''ABORT_DEADLINE|abort wait|harness abort|abort deadline'''
ignore_case = true

[[pattern]]
id = 'vwin'
regex = '''verify_window_|verify-window|fake_agent_(dialog|framing)_replay'''

[[pattern]]
id = 'agents'
regex = '''AGENTS_READ_DEADLINE|agents read|killed at 5 s|claude-agents-read-fail-open'''
ignore_case = true

[[pattern]]
id = 'confirm'
regex = '''confirm-window-close|append_hook_event|snapshot write|snapshots\.update'''

[[pattern]]
id = 'advisory'
regex = '''RUSTSEC-2026-0543|advisory-ignore-list'''

[[pattern]]
id = 'sigkill'
regex = '''SIGKILL[^.;]{0,160}trust record|trust record[^.;]{0,160}SIGKILL|nothing-written-under-claude-home'''

[[pattern]]
id = 'survivor'
regex = '''peer-admitted-survivor|peer_admitted|survivor|equivalent mutant'''
ignore_case = true
