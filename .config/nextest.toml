[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"

# The `verify_window_` class (the overseer's decision, founder-delegated, 2026-10-05): a test that
# drives `viola verify` has no test-side bound on that call, and this per-test kill is its bound.
# Verify's four interactive runs make a designed floor: ten 300 ms settles since chunk
# 2026-10-06-local-command-and-paste-framing-rows. The kill was sized when they were seven (about
# 2.1 s median on the ubuntu coverage leg, measured) from that floor plus a 3x runner tail; the
# longest verify-driven test read 9.98 s under it in ci#37534758441.
# The first matching override wins: a `verify_window_` test waits out the gate's 8.5 s maximum five
# times by design (A, B, C, D and Run F's own designed settle), so it comes first, under an 80 s
# kill: the no-screen case read 52.2-52.3 s over three implement runs of chunk
# 2026-11-17-trust-record-ledger-row, against the 42.9-43.7 s the 60 s kill was sized for; the
# growth is Run F's 8.5 s settle, a floor by design (testing.md 2026-10-05), moved with a
# planted-hang pair recorded in chunk 2026-11-18-trust-record-row-read-live's evidence.
# The two drift replay tests are of the class by what they run, a whole `viola verify` per recorded
# set (`tests/support/verify.rs`'s class note), so they are taken by name beside its prefix.
[[profile.ci.overrides]]
filter = 'test(/verify_window_/) | test(/fake_agent_(dialog|framing)_replay_matches_every_recorded_/)'
slow-timeout = { period = "20s", terminate-after = 4 }

# Every binary that drives verify, directly or through the stamped-home fixture (its longest other
# test, a `send_window_` one, read 11.25 s on the slowest measured run): a 20 s kill. The fixture
# copies one stamp per built binary, taken once under its lock file, so a stamped-home test runs
# `viola verify` only when it is the build's first to ask. viola-e2e's `harness_lifecycle`, `cli`
# and `harness_tied` drive a stamping verify through `boot`; the never-ready lifecycle case waits
# its own 2 s readiness deadline, not boot's 20 s default.
[[profile.ci.overrides]]
filter = 'binary(channel_endpoint) | binary(channel_error_bodies) | binary(chaos_forward_compat) | binary(channel_links) | binary(chaos_torn_append) | binary(cli_answer) | binary(cli_error_bodies) | binary(cli_fake_agent) | binary(cli_instance_state) | binary(cli_links) | binary(cli_list) | binary(cli_send) | binary(cli_verify) | binary(security_negatives_env_capture) | binary(cli_version_gate) | binary(cli_wheel) | binary(contract_fake_agent_drift) | binary(contract_ledger_probes) | binary(cross_exit_causes) | binary(cross_killed_test) | binary(cross_list_rows) | binary(mcp_tools) | binary(path1_run_start) | binary(run_cli) | binary(security_negatives_socket_dir) | binary(tui_wheel) | binary(harness_lifecycle) | binary(cli) | binary(harness_tied)'
slow-timeout = { period = "10s", terminate-after = 2 }

# The first failure stops scheduling, and the tests already running finish, so their temp dirs and
# session guards drop (an immediate kill leaked one per killed test). A mutant that hangs a test must
# still end as a failed (caught) test, not a cargo-mutants timeout: cargo-mutants' auto timeout floors
# at 20 s, so every in-test wait and this kill (15 s) stay below it — at or above it, a hang grades Timeout.
# The kill moved from 10 s to 15 s for a designed floor: every stamped-home test runs `viola verify`
# against the fake agent before its own work, 6.0-7.3 s warm and over 10 s in a cold parallel
# baseline, and that class is the root package's default population, so a per-class override list
# would miss the next stamped-home binary. This departs from the earlier line that a kill moves only
# with its class, never by raising the default, on the operator's answer.
[profile.mutants]
fail-fast = { max-fail = 1, terminate = "wait" }
slow-timeout = { period = "5s", terminate-after = 3 }

# A `verify_window_` test waits out the gate's 8.5 s maximum wait five times by design (no screen
# replayed: the untrusted, trusted, dialog, plan and trust-record runs) plus Run E: measured 43.078 s
# on ubuntu under `ci` (ci#39383206773) before Run F, then 52.2-52.3 s on the Linux dev host with
# Run F's settle, so it takes the class's `ci` kill, 80 s (the 60 s kill left it under 8 s).
# It stands first because the first matching override wins: a harness test of the class also
# matches `package(viola-e2e)` below, and would otherwise take that 30 s kill, under its own wait.
# The two drift replay tests each run a whole `viola verify` per recorded set, the class's own work,
# so they are taken by name beside its prefix rather than under the 15 s default.
[[profile.mutants.overrides]]
filter = 'test(/verify_window_/) | test(/fake_agent_(dialog|framing)_replay_matches_every_recorded_/)'
slow-timeout = { period = "20s", terminate-after = 4 }

# The harness's own tests wait out its 20 s boot deadline by design. When a diff touches the harness,
# its baseline runs past 20 s, so cargo-mutants' auto timeout scales well above this 30 s kill.
[[profile.mutants.overrides]]
filter = 'package(viola-e2e)'
slow-timeout = { period = "15s", terminate-after = 2 }

# A `send_window_` test waits out the product's own 10 s confirmation window by design.
[[profile.mutants.overrides]]
filter = 'test(/send_window_/)'
slow-timeout = { period = "15s", terminate-after = 2 }

# A `send_under_the_paste_hint_` test waits out the product's gate (its 8.5 s maximum wait) under a
# held paste hint by design: 8.7-9.9 s under `ci` (ci#39383206773), under the 10 s default
# kill it then had, now 15 s. It takes the `send_window_` class's kill.
[[profile.mutants.overrides]]
filter = 'test(/send_under_the_paste_hint_/)'
slow-timeout = { period = "15s", terminate-after = 2 }
