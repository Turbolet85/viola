[test-groups]
fixed-port = { max-threads = 1 }

# Every test touching the default port 47319 carries `default_port` in its name.
[[profile.default.overrides]]
filter = 'test(/default_port/)'
test-group = 'fixed-port'

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"

# The `verify_window_` class (the overseer's decision, founder-delegated, 2026-10-05): a test that
# drives `viola verify` has no test-side bound on that call, and this per-test kill is its bound.
# Verify's four interactive runs make a designed floor: ten 300 ms settles since chunk
# 2026-10-06-local-command-and-paste-framing-rows. The kill was sized when they were seven (about
# 2.1 s median on the ubuntu coverage leg, measured) from that floor plus a 3x runner tail; the
# longest verify-driven test read 9.98 s under it in ci#37534758441.
# The first matching override wins: a `verify_window_` test waits out the gate's 8.5 s maximum four
# times by design (about 35 s), so it comes first, under a 60 s kill.
[[profile.ci.overrides]]
filter = 'test(/verify_window_/)'
slow-timeout = { period = "20s", terminate-after = 3 }

# Every binary that drives verify, directly or through the stamped-home fixture (its longest other
# test, a `send_window_` one, read 11.25 s on the slowest measured run): a 20 s kill.
[[profile.ci.overrides]]
filter = 'binary(channel_endpoint) | binary(cli_answer) | binary(cli_fake_agent) | binary(cli_instance_state) | binary(cli_send) | binary(cli_verify) | binary(cli_version_gate) | binary(cli_wheel) | binary(conpty_sideload) | binary(contract_fake_agent_drift) | binary(contract_ledger_probes) | binary(tui_wheel)'
slow-timeout = { period = "10s", terminate-after = 2 }

# The first failure stops scheduling, and the tests already running finish, so their temp dirs and
# session guards drop (an immediate kill leaked one per killed test). A mutant that hangs a test must
# still end as a failed (caught) test, not a cargo-mutants timeout: cargo-mutants' auto timeout floors
# at 20 s, so every in-test wait and this kill (10 s) stay below it — at or above it, a hang grades Timeout.
[profile.mutants]
fail-fast = { max-fail = 1, terminate = "wait" }
slow-timeout = { period = "5s", terminate-after = 2 }

# The harness's own tests wait out its 20 s boot deadline by design. When a diff touches the harness,
# its baseline runs past 20 s, so cargo-mutants' auto timeout scales well above this 30 s kill.
[[profile.mutants.overrides]]
filter = 'package(viola-e2e)'
slow-timeout = { period = "15s", terminate-after = 2 }

# A `send_window_` test waits out the product's own 10 s confirmation window by design.
[[profile.mutants.overrides]]
filter = 'test(/send_window_/)'
slow-timeout = { period = "15s", terminate-after = 2 }

# A `verify_window_` test waits out the gate's 8.5 s maximum wait four times by design (no screen
# replayed: the untrusted, trusted, dialog and plan runs), about 35 s, below this 45 s kill.
[[profile.mutants.overrides]]
filter = 'test(/verify_window_/)'
slow-timeout = { period = "15s", terminate-after = 3 }
