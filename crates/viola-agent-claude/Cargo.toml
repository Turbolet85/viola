[package]
name = "viola-agent-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# No code behind it: it exists so that a `--features fake-agent` build scoped to this package
# (cargo-mutants) resolves.
fake-agent = []

[dependencies]
viola-core = { path = "../viola-core" }
# Epoch seconds and RFC 3339 text to one UTC form (the statusline reader): pure, no clock read.
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
vt100.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
