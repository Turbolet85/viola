[package]
name = "viola-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# No code behind it: it exists so that a `--features fake-agent` build scoped to this package
# (cargo-mutants) resolves.
fake-agent = []

[dependencies]
viola-core = { path = "../viola-core" }
viola-channel = { path = "../viola-channel", features = ["tokio"] }
viola-state = { path = "../viola-state" }
viola-agent-claude = { path = "../viola-agent-claude" }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
