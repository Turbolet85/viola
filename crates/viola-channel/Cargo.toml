[package]
name = "viola-channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# No code behind it: it exists so that a `--features fake-agent` build scoped to this package
# (cargo-mutants) resolves.
fake-agent = []

[dependencies]
viola-core = { path = "../viola-core" }
# The sync API only: the Tokio client lands behind a feature with its first consumer, viola-mcp.
interprocess.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
veil.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
