[package]
name = "viola-hyprland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# No code behind it: it exists so that a `--features fake-agent` build scoped to this package
# (cargo-mutants) resolves.
fake-agent = []

[dependencies]
viola-core = { path = "../viola-core" }
nutype.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true
# Line capture in this crate's own unit tests: never a subscriber in the library itself.
tracing-subscriber.workspace = true

[lints]
workspace = true
