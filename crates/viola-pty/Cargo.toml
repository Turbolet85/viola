[package]
name = "viola-pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# No code behind it: it exists so that a `--features fake-agent` build scoped to this package
# (cargo-mutants) resolves.
fake-agent = []
# MEASUREMENT ONLY: the two H2 race tests (with and without the sideloaded ConPTY); no product code.
h2-measure = []

[dependencies]
portable-pty.workspace = true
# Spans on the seam operations only (obs-plan §3); never on read or write.
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
mockall.workspace = true
tempfile.workspace = true

[lints]
workspace = true
