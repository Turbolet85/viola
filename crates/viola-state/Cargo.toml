[package]
name = "viola-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# No code behind it: it exists so that a `--features fake-agent` build scoped to this package
# (cargo-mutants) resolves.
fake-agent = []

[dependencies]
viola-core = { path = "../viola-core" }
chrono.workspace = true
# `geteuid` for the strict-modes owner check.
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
# The one atomic-replace primitive (`fs::replace_private`): a product dependency here.
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
# The unit tests' line capture (`test_capture`): tests only.
tracing-subscriber.workspace = true

[lints]
workspace = true
