[package]
name = "viola-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The harness spawns the fake agent built by the root package; the feature exists here so that a
# `--features fake-agent` invocation scoped to this package (cargo-mutants) resolves.
fake-agent = []

[[bin]]
name = "viola-harness"
path = "src/bin/viola-harness.rs"

[dependencies]
viola-core = { path = "../viola-core" }
clap.workspace = true
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true

# viola-harness prints its JSON document by design: no workspace print bans here (obs-plan B5).
[lints.rust]
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
