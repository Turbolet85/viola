[package]
name = "viola-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The harness spawns the fake agent built by the root package; the feature exists here so that a
# `--features fake-agent` invocation scoped to this package (cargo-mutants) resolves.
fake-agent = []

[[bin]]
name = "viola-harness"
path = "src/bin/viola-harness.rs"

# Records one live `initialize` / `tools/list` exchange with `viola mcp` and writes its fixture.
[[bin]]
name = "viola-mcp-tap"
path = "src/bin/viola-mcp-tap.rs"

[dependencies]
viola-core = { path = "../viola-core" }
viola-pty = { path = "../viola-pty" }
# `cleanup` proves each recorded endpoint unconnectable with the viola client.
viola-channel = { path = "../viola-channel" }
viola-state = { path = "../viola-state" }
# The recorded `Mcp.` fixture goes through the `--record` scrub and its closed refusal codes.
viola-agent-claude = { path = "../viola-agent-claude" }
clap.workspace = true
jsonschema.workspace = true
# The pin enables `span-locations`, which the mutation run's host reader takes its spans from.
proc-macro2.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
# The stdio MCP E2E (`tests/mcp_tools.rs`): an rmcp client over a `viola mcp` child the test owns.
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["rt", "process"] }

# The e2e-home keeper reads a linked backing's free bytes (`statvfs`) before a home is made.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# viola-harness prints its JSON document by design: no workspace print bans here (obs-plan B5).
[lints.rust]
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
