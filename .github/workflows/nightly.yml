name: nightly

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny@0.20.2
      - name: Advisories (cargo deny)
        shell: bash
        run: |
          cargo deny --version
          cargo deny check advisories

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Toolchain (fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: rustup toolchain install
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz@0.13.2
      - name: Time-boxed fuzz (120 s per target)
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' fuzz/rust-toolchain.toml)
          test -n "$channel"
          for src in fuzz/fuzz_targets/*.rs; do
            t=$(basename "$src" .rs)
            cargo "+$channel" fuzz run --fuzz-dir fuzz "$t" "fuzz/corpus/$t" -- -max_total_time=120
          done
      # Crash reproducers are fuzzer inputs, not test output.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 7
          if-no-files-found: warn
