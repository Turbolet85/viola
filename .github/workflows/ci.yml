name: ci

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-latest]
    env:
      AGENT_RUN_KEEP_HOMES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          # cargo-mutants too: the harness's own tests drive `run --mutants` against a temp project
          tool: cargo-nextest@0.9.146,cargo-mutants@27.1.0

      - name: Unit and integration (pwsh shim)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/agent-run.ps1 run --unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/agent-run.ps1 run --integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit and integration (sh shim)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/agent-run.sh run --unit
          bash scripts/agent-run.sh run --integration

      - name: Harness lifecycle (pwsh shim)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Step { param([string[]]$a) ./scripts/agent-run.ps1 @a; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Step cleanup, --session, ci-smoke
          Step boot, --session, ci-smoke, --instance, builder
          Step status, --session, ci-smoke
          $lines = ./scripts/agent-run.ps1 logs --session ci-smoke --instance builder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $starts = @($lines | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.record.event -eq 'process-start' -and $_.record.process -eq 'run' })
          if ($starts.Count -lt 1) { Write-Error 'no process-start line from viola run'; exit 1 }
          Step cleanup, --session, ci-smoke
          Step cleanup, --session, ci-smoke
      - name: Harness lifecycle (sh shim)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/agent-run.sh cleanup --session ci-smoke
          bash scripts/agent-run.sh boot --session ci-smoke --instance builder
          bash scripts/agent-run.sh status --session ci-smoke
          bash scripts/agent-run.sh logs --session ci-smoke --instance builder \
            | python3 -c "import json,sys; recs=[json.loads(l) for l in sys.stdin if l.strip()]; sys.exit(0 if any(r.get('record',{}).get('event')=='process-start' and r['record'].get('process')=='run' for r in recs) else 1)"
          bash scripts/agent-run.sh cleanup --session ci-smoke
          bash scripts/agent-run.sh cleanup --session ci-smoke

      # obs-plan §9 step order: G2 and G4 over the kept homes, the failure capture, the secret scan,
      # then uploads only behind a clean scan (a bare always()/failure() would upload after a hit).
      - name: Gate tools present
        shell: bash
        run: jq --version
      - name: G2 zero panics
        if: always()
        shell: bash
        run: |
          test -n "$(find target/e2e-home -path '*/diagnostics/*.ndjson' ! -name 'detail-*' -print -quit)"
          find target/e2e-home -path '*/diagnostics/*.ndjson' ! -name 'detail-*' -exec awk 1 {} + | jq -R -n -e '[inputs|fromjson?|select(.event=="panic")]|length==0'
      - name: G4 schema conformance
        id: schema-conformance
        if: always()
        shell: bash
        run: bash scripts/agent-run.sh schema-check
      - name: Harness capture
        if: failure()
        shell: bash
        run: |
          mkdir -p target/agent-run
          bash scripts/agent-run.sh logs --session ci-smoke > target/agent-run/logs.ndjson || true
          bash scripts/agent-run.sh status --session ci-smoke > target/agent-run/status.json || true
      - name: Secret scan
        id: secret-scan
        if: always()
        shell: bash
        run: bash scripts/agent-run.sh secret-scan

      - name: Upload diagnostics
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-${{ matrix.os }}
          path: target/e2e-home/**/diagnostics/*.ndjson
          retention-days: 7
          if-no-files-found: warn
      - name: Upload harness capture
        if: failure() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-${{ matrix.os }}
          path: target/agent-run/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload JUnit
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Upload secret-scan hit report
        if: always() && steps.secret-scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-${{ matrix.os }}
          path: target/secret-scan/
          retention-days: 7
          if-no-files-found: warn

  mutants:
    name: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-nextest@0.9.146,cargo-mutants@27.1.0
      - name: Mutation gate (chunk diff)
        shell: bash
        env:
          AGENT_RUN_CHUNK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/agent-run.sh run --mutants
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants
          path: mutants.out/
          retention-days: 7
          if-no-files-found: warn

  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tokio-free check of the sync crates
        shell: bash
        run: |
          test -s scripts/sync-crates.txt
          cargo check $(sed 's/^/-p /' scripts/sync-crates.txt)
      - name: Format
        shell: bash
        run: cargo fmt --all --check
      - name: Clippy (warnings fatal; print and raw-log bans)
        shell: bash
        run: cargo clippy --workspace --all-targets --features fake-agent -- -D warnings
      - name: Install ripgrep (PCRE2, checksum-pinned)
        shell: bash
        run: |
          bash scripts/install-ripgrep.sh
          (cd target/tools/ripgrep/bin && { pwd -W 2>/dev/null || pwd; }) >> "$GITHUB_PATH"
      - name: ripgrep has PCRE2
        shell: bash
        run: rg --pcre2-version
      # G1 and G3 are copied verbatim from obs-plan §9; only rg exit 1 (no match) passes.
      - name: G1 bare instrument
        shell: bash
        run: |
          set +e; rg -n -U --pcre2 --type rust '#\[(tracing::)?instrument\b(?!\(\s*skip_all\b)' .; test $? -eq 1
      - name: G3 no abort panic strategy
        shell: bash
        run: |
          set +e; rg -n --hidden -g 'Cargo.toml' -g 'config.toml' -g '*.yml' -g '*.yaml' "(panic|_PANIC)\s*[:=]\s*[\"']?abort" .; test $? -eq 1
      - name: Lint probes (bans fire both ways, raw event! grep)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/lint-probes.sh

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny@0.20.2
      - name: Install zizmor
        run: cargo install --locked zizmor@1.30.1
      - name: Tool versions
        shell: bash
        run: |
          cargo deny --version
          zizmor --version

      - name: Dependency policy (cargo deny, all four families)
        shell: bash
        run: |
          mkdir -p target/supply-chain
          cargo deny --format json check 2> target/supply-chain/deny.json || { cat target/supply-chain/deny.json; exit 1; }
      - name: Tokio ban per sync crate (sole root)
        shell: bash
        run: |
          test -s scripts/sync-crates.txt
          while read -r crate; do
            cargo deny --config deny-sync.toml --manifest-path "crates/$crate/Cargo.toml" check bans
          done < scripts/sync-crates.txt
      - name: Ban probes
        shell: bash
        run: bash scripts/deny-probes.sh
      - name: Workflow lint (zizmor)
        shell: bash
        run: |
          mkdir -p target/supply-chain
          zizmor --format=json .github/workflows/ > target/supply-chain/zizmor.json || { cat target/supply-chain/zizmor.json; exit 1; }

      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain
          path: target/supply-chain/
          retention-days: 7
          if-no-files-found: warn
