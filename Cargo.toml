[package]
name = "viola"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
fake-agent = []

[[bin]]
name = "viola"
path = "src/main.rs"

[[bin]]
name = "viola-fake-agent"
path = "src/bin/viola-fake-agent.rs"
required-features = ["fake-agent"]

[[test]]
name = "run_cli"
path = "tests/run_cli.rs"
required-features = ["fake-agent"]

[[test]]
name = "cli_fake_agent"
path = "tests/cli_fake_agent.rs"
required-features = ["fake-agent"]

[[test]]
name = "contract_fixture_hygiene"
path = "tests/contract_fixture_hygiene.rs"
required-features = ["fake-agent"]

[[test]]
name = "contract_diag_schema"
path = "tests/contract_diag_schema.rs"
required-features = ["fake-agent"]

[[test]]
name = "contract_lints"
path = "tests/contract_lints.rs"
required-features = ["fake-agent"]

[dependencies]
viola-core = { path = "crates/viola-core" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
jsonschema.workspace = true
rstest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.7", features = ["derive"] }
# Default features pull reqwest and the C-building aws-lc-rs; schemas are local files only.
jsonschema = { version = "=0.57.0", default-features = false }
nutype = "=0.8.0"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
rstest = { version = "=0.27.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }

[workspace.lints.rust]
unused_must_use = "deny"

# stdout carries only `--json`, the hook decision body, MCP frames and the child's screen: a stray
# print breaks those contracts (obs-plan §11 Logs). Output modules take a local `#[allow]`.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
