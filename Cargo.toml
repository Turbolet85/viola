[package]
name = "viola"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
fake-agent = []

[[bin]]
name = "viola"
path = "src/main.rs"

[[bin]]
name = "viola-fake-agent"
path = "src/bin/viola-fake-agent.rs"
required-features = ["fake-agent"]

[[test]]
name = "run_cli"
path = "tests/run_cli.rs"
required-features = ["fake-agent"]

[[test]]
name = "cli_fake_agent"
path = "tests/cli_fake_agent.rs"
required-features = ["fake-agent"]

[[test]]
name = "contract_fixture_hygiene"
path = "tests/contract_fixture_hygiene.rs"
required-features = ["fake-agent"]

[[test]]
name = "contract_diag_schema"
path = "tests/contract_diag_schema.rs"
required-features = ["fake-agent"]

[[test]]
name = "contract_lints"
path = "tests/contract_lints.rs"
required-features = ["fake-agent"]

[[test]]
name = "tui_pty_seam"
path = "tests/tui_pty_seam.rs"
required-features = ["fake-agent"]

[[test]]
name = "tui_passthrough"
path = "tests/tui_passthrough.rs"
required-features = ["fake-agent"]

[[test]]
name = "tui_env_strip"
path = "tests/tui_env_strip.rs"
required-features = ["fake-agent"]

[[test]]
name = "cli_program_resolution"
path = "tests/cli_program_resolution.rs"
required-features = ["fake-agent"]

[[test]]
name = "cli_instance_state"
path = "tests/cli_instance_state.rs"
required-features = ["fake-agent"]

[[test]]
name = "channel_endpoint"
path = "tests/channel_endpoint.rs"
required-features = ["fake-agent"]

[[test]]
name = "tui_channel_fds"
path = "tests/tui_channel_fds.rs"
required-features = ["fake-agent"]

[[test]]
name = "hook_fail_open"
path = "tests/hook_fail_open.rs"
required-features = ["fake-agent"]

[[test]]
name = "hook_events"
path = "tests/hook_events.rs"
required-features = ["fake-agent"]

[[test]]
name = "cli_controls_not_disableable"
path = "tests/cli_controls_not_disableable.rs"
required-features = ["fake-agent"]

[dependencies]
viola-core = { path = "crates/viola-core" }
viola-pty = { path = "crates/viola-pty" }
viola-agent-claude = { path = "crates/viola-agent-claude" }
viola-state = { path = "crates/viola-state" }
viola-channel = { path = "crates/viola-channel" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Raw frames and raw servers against a real endpoint, beside the viola client.
interprocess.workspace = true
jsonschema.workspace = true
rstest.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
# The shared test helpers (tracing field capture, the pipe DACL read-back): tests only, never a
# release build (scripts/release-check.sh proves the feature absent).
viola-channel = { path = "crates/viola-channel", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints]
workspace = true

[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.7", features = ["derive"] }
# The sync API only: the `tokio` feature stays confined to viola-mcp / viola-ui.
interprocess = "=2.4.4"
# Default features pull reqwest and the C-building aws-lc-rs; schemas are local files only.
jsonschema = { version = "=0.57.0", default-features = false }
# Only for termios raw mode and the terminal size on Unix; already in the graph through portable-pty.
libc = "=0.2.189"
mockall = "=0.15.0"
nutype = "=0.8.0"
# 0.8.1, not the newer 0.9.0: from 0.9.0 `pty.read` returns garbage on Windows (wezterm#6783, still
# open and 0.9.0 still the newest release on 2026-09-25). 0.8.1 spawns with `bInheritHandles = 0`
# (src/win/psuedocon.rs:141); child exit is read on the process handle, never on EOF (ConPTY does not
# close its output when the child exits).
portable-pty = "=0.8.1"
# `span-locations`: real line numbers outside a proc macro, for the mutants union's cfg reading.
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
proptest ={ version = "=1.11.0", default-features = false, features = ["std"] }
rstest = { version = "=0.27.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
# The drift report for a hook payload's known field of the wrong type (viola-agent-claude only).
serde_path_to_error = "=0.1.20"
# The truncated SHA-256 `<hash>` of bin/ and plugin/: pure Rust, no default `alloc`/`oid`.
sha2 = { version = "=0.11.0", default-features = false }
# viola-e2e only: parses source for the `#[cfg]`s around a mutant (harness/cfg_legs.rs).
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "printing", "visit"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
# `attributes`: `#[instrument(skip_all, name = "<area>.<operation>", fields(..))]`, the only span form (obs-plan §3).
tracing = { version = "=0.1.44", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }
# No `toggle`: redaction can never be switched off at runtime (deny.toml bans it).
veil = "=0.3.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading"] }

[workspace.lints.rust]
unused_must_use = "deny"

# stdout carries only `--json`, the hook decision body, MCP frames and the child's screen: a stray
# print breaks those contracts (obs-plan §11 Logs). Output modules take a local `#[allow]`.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[profile.dev]
panic = "unwind"

# The pinned-copy key hashes the whole running exe on every start (38 MB unoptimized on Linux):
# the digest runs optimized in dev and test builds too.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
panic = "unwind"
