# Tokio ban for the sync crates, run once per crate in scripts/sync-crates.txt as the sole root:
#   cargo deny --config deny-sync.toml --manifest-path crates/<crate>/Cargo.toml check bans
# `--exclude` over the workspace cannot express this: feature unification keeps a shared crate's optional
# tokio feature on after the crate enabling it is excluded.

[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
exclude-dev = true

[bans]
deny = [
  { crate = "tokio", reason = "tokio is confined to viola-mcp and viola-ui; the sync crates stay tokio-free" },
]
